server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # No /api proxy here - this frontend reads execution's/market-data's/
    # signal-generation's/signal-processing's APIs directly from the
    # browser (CORS-enabled), see src/api.ts.

    # Docker's embedded DNS resolver, re-resolved every 10s instead of
    # once at nginx startup/config-load - same reasoning as execution/
    # frontend's own resolver (market-data-backend gets a new internal IP
    # every time it's recreated, e.g. an unrelated `docker compose up -d
    # --build` elsewhere, which otherwise 502s every request here until
    # this container itself is restarted).
    resolver 127.0.0.11 valid=10s;

    # Live LTP push (useQuoteSocket.ts) - proxied through this frontend's
    # own already-open port instead of a direct browser connection to
    # market-data-backend's bare port, which isn't guaranteed reachable
    # from outside Docker (e.g. a VPS firewall/security group that only
    # opens the frontend ports) - a WS handshake to a blocked bare port
    # just times out with no server-side trace at all, silently degrading
    # every Live Chart tab to REST polling. See docs/architecture.md.
    location /ws/ {
        set $upstream market-data-backend:8000;
        proxy_pass http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # A quiet WS (no ticks for a while, e.g. market closed) must not
        # get reaped as an idle connection - keep it open well past any
        # realistic gap between ticks.
        proxy_read_timeout 3600s;
    }

    # Vite emits content-hashed filenames under /assets/ - safe to cache
    # forever. Everything else (index.html above all) must revalidate every
    # load, or a rebuild silently keeps serving the old bundle.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri /index.html;
    }
}
