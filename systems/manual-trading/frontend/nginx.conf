server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # No /api proxy here - this frontend reads execution's/market-data's/
    # signal-generation's/signal-processing's APIs directly from the
    # browser (CORS-enabled), see src/api.ts.

    # Vite emits content-hashed filenames under /assets/ - safe to cache
    # forever. Everything else (index.html above all) must revalidate every
    # load, or a rebuild silently keeps serving the old bundle.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri /index.html;
    }
}
