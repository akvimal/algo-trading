name: algo-trading

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - ./infra/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The merger (2026-08-28, see docs/architecture.md) of the old
  # signal-generation and signal-processing services - they were coupled
  # by a synchronous HTTP call on every single signal (resolution
  # fetching a Strategy over HTTP), unlike every other cross-system
  # relationship in this platform. One service now, still two Postgres
  # schemas (no data migration - both already lived in the same shared
  # database). Infra-tier, not gated behind a profile: execution's
  # square-off job and every signal-source webhook depend on this being
  # reachable, so it's expected to be up alongside postgres/redis.
  signal-engine-backend:
    build:
      context: ./systems/signal-engine/backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      GENERATION_DATABASE_SCHEMA: signal_generation
      PROCESSING_DATABASE_SCHEMA: signal_processing
      REDIS_URL: redis://redis:6379/0
      REDIS_STREAM: orders.resolved
      # A second, separate stream from REDIS_STREAM above - moves resolve()'s
      # Dhan-throttled option-chain calls off the webhook/POST /signals
      # request-response cycle onto a background consumer, purely internal
      # to this service. See app/config.py/app/consumers/signal_resolution_consumer.py.
      SIGNAL_RESOLUTION_STREAM: signals.pending_resolution
      SIGNAL_RESOLUTION_CONSUMER_GROUP: signal-processing-resolver
      SIGNAL_RESOLUTION_CONSUMER_NAME: signal-processing-resolver-1
      # Option-strategy resolution only (Phase 4b of the options trading
      # module) - see app/adapters/market_data/client.py.
      MARKET_DATA_BASE_URL: http://market-data-backend:8000
      # Strategy ownership (2026-08-30) - decodes the same bearer tokens
      # systems/accounts issues, purely for attribution (see app/auth.py's
      # own comment). Must match ACCOUNTS_JWT_SECRET exactly.
      JWT_SECRET: ${ACCOUNTS_JWT_SECRET}
    ports:
      - "${SIGNAL_ENGINE_BACKEND_PORT}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      market-data-backend:
        condition: service_started

  signal-engine-frontend:
    build:
      context: ./systems/signal-engine/frontend
      args:
        VITE_SIGNAL_ENGINE_PORT: ${SIGNAL_ENGINE_BACKEND_PORT}
        VITE_MARKET_DATA_PORT: ${MARKET_DATA_BACKEND_PORT}
        VITE_EXECUTION_PORT: ${EXECUTION_BACKEND_PORT}
        # Now gated behind a login too (see AuthGate.tsx) - accounts-backend
        # sits behind the "execution" profile, so like manual-trading's and
        # market-data's own logins, this simply errors until it's up.
        VITE_ACCOUNTS_PORT: ${ACCOUNTS_BACKEND_PORT}
    restart: unless-stopped
    ports:
      - "${SIGNAL_ENGINE_FRONTEND_PORT}:80"
    depends_on:
      - signal-engine-backend

  # Infra-tier, not gated behind a profile: execution's square-off job
  # depends on this being reachable, so it's expected to be up alongside
  # postgres/redis rather than started only when the "execution" system is.
  market-data-backend:
    build:
      context: ./systems/market-data/backend
    restart: unless-stopped
    environment:
      # market-data's first-ever DB dependency - sentiment_history only
      # (app/config.py's own comment) - everything else here stays
      # in-memory-cache-only exactly as before.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DATABASE_SCHEMA: market_data
      DHAN_CLIENT_ID: ${DHAN_CLIENT_ID}
      DHAN_ACCESS_TOKEN: ${DHAN_ACCESS_TOKEN}
      # Default 20 (auto-renew every 20h). Set to 0 only if this stack ever
      # shares its DHAN_ACCESS_TOKEN with another auto-renewing stack -
      # dev/test each use their own separate token instead, so both stay
      # at the default. See app/config.py/app/scheduler.py.
      DHAN_TOKEN_RENEW_INTERVAL_HOURS: ${DHAN_TOKEN_RENEW_INTERVAL_HOURS:-20}
      # Manual override for Dhan's own SEM_LOT_UNITS, confirmed wrong for
      # MCX commodities (every FUTCOM row reports 1 regardless of real
      # contract size). Each commodity's real trading-unit/quotation-unit
      # ratio - a mini/micro variant is NOT automatically the same
      # multiplier as its full-size sibling - see app/config.py.
      # "underlying:qty" pairs, comma-separated. See
      # app/providers/dhan.py's _parse_lot_size_overrides.
      MCX_LOT_SIZE_OVERRIDES: ${MCX_LOT_SIZE_OVERRIDES:-GOLD:100,GOLDM:10,CRUDEOIL:100,CRUDEOILM:10,SILVER:30,SILVERM:5,SILVERMIC:1,SILVER100:10,NATURALGAS:1250,NATGASMINI:250}
      # BYO Dhan credentials (Phase 3, see docs/architecture.md) - lets a
      # request carrying a real user's bearer token (forwarded by
      # execution-backend on the manual-order/square-off routes) use that
      # user's own Dhan credentials/rate budget instead of the platform
      # default above. A missing/invalid token, or accounts-backend being
      # unreachable, degrades to the platform default - see app/auth.py
      # and app/adapters/accounts_client.py's own comments. Must match
      # ACCOUNTS_JWT_SECRET/INTERNAL_SERVICE_SECRET exactly.
      JWT_SECRET: ${ACCOUNTS_JWT_SECRET}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET}
      ACCOUNTS_BASE_URL: http://accounts-backend:8000
      # Live-broker-adapter P0 (see docs/architecture.md) - DHAN_POSTBACK_SECRET
      # is the shared-secret PATH segment for Dhan's own order-update
      # postback (register https://<this-host>/dhan/order-update/<secret>
      # with Dhan, never the bare path - see app/config.py's own comment).
      # EXECUTION_BASE_URL is where a validated postback gets relayed -
      # market-data holds no order state of its own.
      DHAN_POSTBACK_SECRET: ${DHAN_POSTBACK_SECRET}
      EXECUTION_BASE_URL: http://execution-backend:8000
      # Standalone price alerts (app/domain/price_alerts.py + scheduler) -
      # one bot + chat receives every fired alert. Both blank = alerts
      # still evaluate/persist, nothing gets pushed (see app/domain/notify.py).
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    volumes:
      # PUT /dhan/credentials persists here (app/providers/dhan.py) so a
      # UI-submitted Dhan token survives a container restart instead of
      # reverting to the DHAN_ACCESS_TOKEN env var above - see
      # docs/architecture.md. Compose namespaces named volumes per
      # project, so dev (`algo-trading`) and test (`algo-trading-test`)
      # each get their own, matching every other dev/test isolation
      # guarantee this stack already has.
      - dhan-credentials:/data
    ports:
      - "${MARKET_DATA_BACKEND_PORT}:8000"
    depends_on:
      postgres:
        condition: service_healthy

  market-data-frontend:
    build:
      context: ./systems/market-data/frontend
      args:
        VITE_MARKET_DATA_PORT: ${MARKET_DATA_BACKEND_PORT}
        # Admin login for the Data provider (Dhan) panel only (moved here
        # from execution/frontend - see docs/architecture.md) - same
        # direct-from-browser CORS pattern execution/manual-trading's own
        # accounts-backend calls already use. accounts-backend itself sits
        # behind the "execution" profile, so that one panel's login simply
        # errors until it's up - the rest of this dashboard needs no login
        # and is unaffected.
        VITE_ACCOUNTS_PORT: ${ACCOUNTS_BACKEND_PORT}
    restart: unless-stopped
    ports:
      - "${MARKET_DATA_FRONTEND_PORT}:80"
    depends_on:
      - market-data-backend

  execution-backend:
    profiles: ["execution"]
    build:
      context: ./systems/execution/backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DATABASE_SCHEMA: execution
      REDIS_URL: redis://redis:6379/0
      REDIS_STREAM: orders.resolved
      REDIS_CONSUMER_GROUP: execution-service
      MARKET_DATA_BASE_URL: http://market-data-backend:8000
      # Verifies the same bearer tokens accounts-backend issues - see
      # app/auth.py's own comment. Must match ACCOUNTS_JWT_SECRET exactly.
      JWT_SECRET: ${ACCOUNTS_JWT_SECRET}
      # Live-broker-adapter P0 (see docs/architecture.md) - protects
      # POST /internal/dhan/order-update (market-data relaying Dhan's own
      # postback). Must match market-data's/accounts' identical
      # INTERNAL_SERVICE_SECRET. LIVE_TRADING_KILL_SWITCH=true instantly
      # BLOCKS real order submission for every account at once, regardless
      # of any account's own live_trading_enabled opt-in - default false
      # (not killed) leaves that decision to each account's own flag,
      # which itself still defaults to false (paper-only) until someone
      # deliberately opts an account in.
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET}
      LIVE_TRADING_KILL_SWITCH: ${LIVE_TRADING_KILL_SWITCH:-false}
    ports:
      - "${EXECUTION_BACKEND_PORT}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      market-data-backend:
        condition: service_started

  # Identity + BYO broker-credential storage for the manual-trading SaaS
  # (see docs/architecture.md § "Manual Trading SaaS - Phase 1: accounts
  # service"). Gated behind the same profile as execution - Phase 1 is a
  # standalone service with no other backend wired to it yet, but it's
  # meaningless without execution/manual-trading up too.
  accounts-backend:
    profiles: ["execution"]
    build:
      context: ./systems/accounts/backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DATABASE_SCHEMA: accounts
      JWT_SECRET: ${ACCOUNTS_JWT_SECRET}
      CREDENTIALS_ENCRYPTION_KEY: ${ACCOUNTS_CREDENTIALS_ENCRYPTION_KEY}
      # Shared only with market-data-backend (Phase 3, BYO Dhan
      # credentials - see docs/architecture.md) - protects GET
      # /internal/credentials/{user_id}/dhan, the one route in this
      # service that returns a decrypted plaintext secret, since its
      # caller is a trusted service rather than a user with a JWT.
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET}
    ports:
      - "${ACCOUNTS_BACKEND_PORT}:8000"
    depends_on:
      postgres:
        condition: service_healthy

  execution-frontend:
    profiles: ["execution"]
    build:
      context: ./systems/execution/frontend
      args:
        VITE_API_BASE_URL: /api
        # Strategy names for the derivatives Orders grid's "Signal" column
        # (id -> name) - same direct-from-browser CORS pattern as above,
        # not execution's own /api proxy (this isn't execution's data).
        VITE_SIGNAL_ENGINE_PORT: ${SIGNAL_ENGINE_BACKEND_PORT}
        # Login/signup (Phase 4, BYO Dhan/Delta credentials SaaS - see
        # docs/architecture.md) - accounts-backend, same direct-from-
        # browser CORS pattern as the two ports above.
        VITE_ACCOUNTS_PORT: ${ACCOUNTS_BACKEND_PORT}
    restart: unless-stopped
    ports:
      - "${EXECUTION_FRONTEND_PORT}:80"
    depends_on:
      - execution-backend

  # Manual Trading + Options OI, split out of signal-generation's frontend
  # (see docs/architecture.md § "Manual Trading module split") - neither
  # ever actually depended on signal-generation's own backend/DB, only on
  # execution's (paper positions/checklist/trade images) and market-data's
  # (option chain/OI), so this is frontend-only, no backend of its own.
  # Gated behind the same profile as execution - it's non-functional
  # without it, unlike signal-engine-frontend's other tabs.
  manual-trading-frontend:
    profiles: ["execution"]
    build:
      context: ./systems/manual-trading/frontend
      args:
        VITE_SIGNAL_ENGINE_PORT: ${SIGNAL_ENGINE_BACKEND_PORT}
        VITE_MARKET_DATA_PORT: ${MARKET_DATA_BACKEND_PORT}
        VITE_EXECUTION_PORT: ${EXECUTION_BACKEND_PORT}
        # Login/signup (Phase 4, BYO Dhan/Delta credentials SaaS - see
        # docs/architecture.md) - accounts-backend, same direct-from-
        # browser CORS pattern as the ports above.
        VITE_ACCOUNTS_PORT: ${ACCOUNTS_BACKEND_PORT}
    restart: unless-stopped
    ports:
      - "${MANUAL_TRADING_FRONTEND_PORT}:80"
    depends_on:
      - execution-backend

  # Static tab shell - not a system of its own, just nav + iframes onto
  # each system's already-independent frontend. See shell/README.md.
  shell:
    build:
      context: ./shell
    restart: unless-stopped
    ports:
      - "${SHELL_PORT}:80"

# --- Later phases (see docs/architecture.md) plug in here behind profiles, e.g.: ---
#   some-new-system-backend:
#     profiles: ["some-new-system"]
#     build: { context: ./systems/some-new-system/backend }
#     ...

volumes:
  pg-data:
  redis-data:
  dhan-credentials:
