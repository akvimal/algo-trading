<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Automate - Strategies and backtests</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1319;--s1:#151b23;--s2:#1c2430;--line:#2a3442;--tx:#e9eef5;--mu:#95a3b5;--ac:#6aa9ff;--up:#4fd3a8;--dn:#ff8b6e;--warn:#f4c15a}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:14px}
*{box-sizing:border-box}
.num{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.up{color:var(--up)}.dn{color:var(--dn)}.mu{color:var(--mu)}
.card{background:var(--s1);border:1px solid var(--line);border-radius:12px}
.h{font-size:13px;font-weight:600;letter-spacing:.01em}
.lbl{font-size:12px;color:var(--mu)}
.chip{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;font-size:11px;font-weight:600;background:var(--s2);border:1px solid var(--line);white-space:nowrap}
.chip.up{background:#0f2a24;border-color:#1d4a3e}.chip.dn{background:#331a14;border-color:#5a2c20}.chip.warn{background:#332a12;border-color:#5b4a1c;color:var(--warn)}.chip.ac{background:#16304f;border-color:#3d6ba3;color:#cfe3ff}
button{font:inherit;color:inherit;cursor:pointer}
.btn{height:34px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--s2);font-size:13px;font-weight:500}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#08111f;font-weight:600}
.btn.off{opacity:.45;cursor:not-allowed}
.item{display:block;width:100%;text-align:left;padding:12px 14px;border-radius:10px;border:1px solid transparent;background:transparent}
.item.on{background:#16304f;border-color:#3d6ba3}
</style>
</helmet>
<div style="width: 1440px; height: 900px; display: flex; overflow: hidden; background: var(--bg)">
  <dc-import name="Sidebar" active="automate" mode="pro" hint-size="232px,900px"></dc-import>

  <main style="flex-grow: 1; min-width: 0; padding: 20px 28px 24px; display: flex; flex-direction: column; gap: 16px">
    <header style="display: flex; align-items: center; gap: 20px; height: 48px">
      <div>
        <h1 style="margin: 0; font-size: 22px; font-weight: 600; line-height: 1.2">Automate</h1>
        <div class="lbl">Strategies place paper orders for you. Live orders need graduation.</div>
      </div>
      <div style="flex-grow: 1"></div>
      <span class="chip warn">Illustrative data</span>
      <button class="btn pri">New strategy</button>
    </header>

    <div style="display: flex; gap: 16px; flex-grow: 1; min-height: 0">
      <section class="card" style="width: 330px; padding: 10px; display: flex; flex-direction: column; gap: 4px; align-self: flex-start">
        <div class="lbl" style="padding: 6px 6px 4px">Strategies</div>
        <sc-for list="{{list}}" as="s" hint-placeholder-count="4">
          <button class="item {{s.cls}}" onClick="{{s.pick}}">
            <div style="display: flex; align-items: center; gap: 8px">
              <div style="font-weight: 600; font-size: 14px; flex-grow: 1">{{s.name}}</div>
              <span class="chip {{s.stCls}}">{{s.status}}</span>
            </div>
            <div style="display: flex; justify-content: space-between; margin-top: 4px"><span class="lbl">{{s.source}}</span><span class="num {{s.pCls}}" style="font-size: 12px">{{s.pnl}}</span></div>
          </button>
        </sc-for>
      </section>

      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 16px">
        <section class="card" style="padding: 16px 18px">
          <div style="display: flex; align-items: center; gap: 10px">
            <div style="font-size: 18px; font-weight: 600">{{cur.name}}</div>
            <span class="chip {{cur.stCls}}">{{cur.status}}</span>
            <div style="flex-grow: 1"></div>
            <button class="btn {{cur.paperOff}}" onClick="{{cur.startPaper}}">{{cur.paperText}}</button>
            <button class="btn off" title="Locked until you graduate">Live locked</button>
          </div>
          <div style="margin-top: 12px; padding: 12px 14px; border-radius: 10px; background: var(--s2); font-size: 14px; line-height: 1.55">{{cur.sentence}}</div>
          <div style="display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap">
            <sc-for list="{{cur.chips}}" as="c" hint-placeholder-count="5"><span class="chip ac">{{c}}</span></sc-for>
          </div>
        </section>

        <section class="card" style="flex-grow: 1; min-height: 0; padding: 14px 18px; display: flex; flex-direction: column">
          <div style="display: flex; align-items: center; justify-content: space-between">
            <div class="h">Backtest · last 6 months</div>
            <div style="display: flex; align-items: center; gap: 12px"><span class="lbl">Uses the same fills, slippage and charges as paper trading</span><button class="btn">Run again</button></div>
          </div>
          <div style="flex-grow: 1; min-height: 0; position: relative; margin-top: 12px">
            <svg width="100%" height="100%" viewBox="0 0 600 160" preserveAspectRatio="none" style="position: absolute; left: 0; top: 0">
              <line x1="0" y1="80" x2="600" y2="80" stroke="#3a4656" stroke-width="1" stroke-dasharray="3 3" vector-effect="non-scaling-stroke"/>
              <polyline points="{{cur.curve}}" fill="none" stroke="{{cur.curveColor}}" stroke-width="2.25" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
            </svg>
          </div>
          <div style="display: flex; gap: 12px; margin-top: 12px">
            <sc-for list="{{cur.stats}}" as="t" hint-placeholder-count="5">
              <div style="flex: 1; padding: 10px 12px; border-radius: 10px; background: var(--s2)">
                <div class="lbl">{{t.k}}</div>
                <div class="num {{t.cls}}" style="font-weight: 500; font-size: 17px; margin-top: 2px">{{t.v}}</div>
              </div>
            </sc-for>
          </div>
        </section>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const st = Object.assign({ sel: 0, paper: {} }, this.state || {});
    const mk = (ys) => ys.map((y, i) => Math.round(i * (600 / (ys.length - 1))) + ',' + y).join(' ');
    const data = [
      { name: 'NIFTY EMA trend', base: 'Paper', src: 'In-house engine', pnl: '+₹6,240',
        sentence: 'When NIFTY closes a 15-minute candle above its 20-period EMA and ADX is above 25, buy the at-the-money call. Stop-loss 25% of premium, target 50%.',
        chips: ['Interval 15m', 'Regime: trending, ADX above 25', 'Active 09:30 to 14:30', 'Size: 1% risk', 'One position at a time'],
        curve: mk([130, 126, 128, 118, 112, 116, 104, 98, 102, 90, 84, 92, 78, 70, 74, 62, 56, 60, 48, 40]), good: true,
        stats: [['Trades', '84', ''], ['Win rate', '54%', ''], ['Expectancy', '+0.31R', 'up'], ['Max drawdown', '−7.8%', 'dn'], ['Profit factor', '1.6', '']] },
      { name: 'BANKNIFTY range fade', base: 'Paper', src: 'In-house engine', pnl: '+₹1,120',
        sentence: 'When BANKNIFTY touches the upper wall of its option-OI range while ADX is below 20, sell a call spread against it. Exit at the middle of the range.',
        chips: ['Interval 5m', 'Regime: ranging, ADX below 20', 'Active 10:00 to 14:00', 'Defined-risk spreads only'],
        curve: mk([90, 94, 88, 92, 86, 90, 82, 88, 80, 84, 78, 82, 76, 80, 74, 78, 72, 76, 70, 72]), good: true,
        stats: [['Trades', '61', ''], ['Win rate', '62%', ''], ['Expectancy', '+0.12R', 'up'], ['Max drawdown', '−4.1%', 'dn'], ['Profit factor', '1.2', '']] },
      { name: 'Chartink breakout scan', base: 'Paper', src: 'Chartink webhook', pnl: '−₹820',
        sentence: 'When the Chartink scan "20-day high with volume" fires, buy the stock at the alert price. Stop-loss below the previous day low.',
        chips: ['Signal from webhook', 'NSE cash', 'Active 09:30 to 15:00', 'Size: 1% risk'],
        curve: mk([80, 84, 78, 88, 82, 92, 86, 96, 90, 100, 94, 104, 98, 108, 102, 112, 106, 116, 110, 118]), good: false,
        stats: [['Trades', '47', ''], ['Win rate', '38%', 'dn'], ['Expectancy', '−0.22R', 'dn'], ['Max drawdown', '−11.3%', 'dn'], ['Profit factor', '0.8', 'dn']] },
      { name: 'BTCUSD SuperTrend', base: 'Draft', src: 'In-house engine', pnl: 'Not started',
        sentence: 'When BTCUSD flips the SuperTrend (10, 3) on the 1-hour chart, take the trade in that direction. Stop at the SuperTrend line.',
        chips: ['Interval 1h', 'Crypto, 24 hours', 'Leverage 1x', 'Size: 1% risk'],
        curve: mk([100, 98, 102, 96, 92, 96, 88, 84, 90, 80, 76, 82, 72, 68, 74, 66, 60, 64, 56, 52]), good: true,
        stats: [['Trades', '112', ''], ['Win rate', '44%', ''], ['Expectancy', '+0.18R', 'up'], ['Max drawdown', '−9.4%', 'dn'], ['Profit factor', '1.3', '']] }
    ];
    const list = data.map((d, i) => {
      const status = st.paper[i] ? 'Paper' : d.base;
      return { name: d.name, source: d.src, pnl: d.pnl, pCls: d.pnl.indexOf('+') === 0 ? 'up' : (d.pnl.indexOf('−') === 0 ? 'dn' : 'mu'),
        status: status, stCls: status === 'Paper' ? 'ac' : '', cls: st.sel === i ? 'on' : '',
        pick: () => this.setState({ sel: i }) };
    });
    const d = data[st.sel];
    const isPaper = st.paper[st.sel] || d.base === 'Paper';
    const cur = {
      name: d.name, status: isPaper ? 'Paper' : 'Draft', stCls: isPaper ? 'ac' : '',
      sentence: d.sentence, chips: d.chips, curve: d.curve, curveColor: d.good ? '#4fd3a8' : '#ff8b6e',
      stats: d.stats.map((t) => ({ k: t[0], v: t[1], cls: t[2] })),
      paperText: isPaper ? 'Running on paper' : 'Start paper trading',
      paperOff: isPaper ? 'off' : 'pri',
      startPaper: () => { if (!isPaper) { const p = Object.assign({}, st.paper); p[st.sel] = true; this.setState({ paper: p }); } }
    };
    return { list: list, cur: cur };
  }
}
</script>
</body>
</html>
