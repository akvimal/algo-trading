# VPS-only overlay - adds Caddy on top of the base docker-compose.yml, and
# strips the host-port publish from every service Caddy fronts.
#
# Found live 2026-09-21: BIND_ADDR=127.0.0.1 alone (docker-compose.yml's
# own mechanism) is NOT enough - a service still published to
# 127.0.0.1:8000 collides with Caddy trying to publish 0.0.0.0:8000 on the
# very same port number ("Bind for 127.0.0.1:8000 failed: port is already
# allocated"). A wildcard (0.0.0.0) bind and a loopback-specific bind on
# the SAME port genuinely conflict at the OS level, regardless of Docker -
# only ONE thing can ever own a given port number on this host. Since
# Caddy never needs the host-published port anyway (it reaches every
# backing service over the docker-compose network directly via service
# name - see infra/caddy/Caddyfile's reverse_proxy targets, container
# port, not host port), the fix is to remove those services' host publish
# entirely once Caddy exists, not just rebind its address. `ports: !reset
# []` forces a real replacement (verified locally - Compose's default
# list-merge for `ports` does NOT clear a base file's entries just because
# an override re-declares an empty list; `!reset` is required for that).
#
# Usage (VPS only, after setting VPS_DOMAIN and BIND_ADDR=127.0.0.1 in .env):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build \
#     postgres redis market-data-backend market-data-frontend signal-engine-backend \
#     execution-backend accounts-backend web-frontend caddy
#
# Named explicitly, not a blanket `--profile execution up -d`: the base
# docker-compose.yml (shared with local dev/test, never edited for VPS-only
# reasons) still defines shell/signal-engine-frontend/execution-frontend/
# manual-trading-frontend unconditionally or under the same "execution"
# profile as the services above - naming exactly what the VPS wants is what
# actually keeps them from starting, since compose has no per-service "never
# run this" switch short of removing it from the base file (which would also
# take it away from local dev/test, so this file doesn't touch that).
# Retired here (2026-09-30): systems/web/frontend is now the VPS's only
# frontend for signal-engine/execution/manual-trading's screens - see
# docs/redesign-rollout-plan.md's "Retiring the classic frontends". If any
# of the four are still running from a previous deploy, remove them once:
#   docker compose stop shell signal-engine-frontend execution-frontend manual-trading-frontend
#   docker compose rm -f shell signal-engine-frontend execution-frontend manual-trading-frontend
# market-data-frontend stays - it's operator tooling (Dhan/Delta feed
# status, instrument-master sync, Dhan token renewal), not an end-user
# screen, and has no web/frontend equivalent.
#
# Never used locally - `make up`/`make test-up` only ever reference the
# base docker-compose.yml, so this file has zero effect on local dev/test.

# Hardening applied to every backend on the VPS (Phase 0 of
# docs/redesign-rollout-plan.md): REQUIRE_SECURE_CONFIG makes each service
# refuse to start while any secret is still a placeholder / under 16 characters
# or CORS is a wildcard (see systems/*/backend/app/secure_config.py), and
# CORS_ALLOW_ORIGINS lists the ONLY browser origin allowed to call them:
# web-frontend, as Caddy serves it (infra/caddy/Caddyfile) - narrowed to just
# this one origin 2026-09-30 now that it's the VPS's only frontend (see the
# classic-frontend retirement note above).
# Before deploying, make sure .env holds real values for ACCOUNTS_JWT_SECRET,
# ACCOUNTS_CREDENTIALS_ENCRYPTION_KEY, INTERNAL_SERVICE_SECRET and
# DHAN_POSTBACK_SECRET (node scripts/generate-secrets.js --write) - a service
# with a placeholder will exit on start, by design. Never rotate
# ACCOUNTS_CREDENTIALS_ENCRYPTION_KEY on a populated DB (saved broker
# credentials become undecryptable).
x-secure-backend-env: &secure-backend-env
  REQUIRE_SECURE_CONFIG: "true"
  CORS_ALLOW_ORIGINS: "https://${VPS_DOMAIN}:${SHELL_PORT}"

services:
  # Host-port publish removed - Caddy is the only thing that should own
  # these port numbers on the VPS. BIND_ADDR=127.0.0.1 in docker-compose.yml
  # is now moot for these (fully overridden here), but still applies - and
  # still matters - to postgres/redis below, which Caddy doesn't front.
  #
  # shell/signal-engine-frontend/execution-frontend/manual-trading-frontend
  # have no block here any more (2026-09-30) - they're not part of this
  # file's active service list at all now, see the classic-frontend
  # retirement note above. web-frontend takes over shell's old port
  # (SHELL_PORT, still named that in .env/Caddyfile - the port number is
  # what "the default URL" means, not the container behind it) rather than
  # getting a new one of its own, so nobody has to learn a new port.
  web-frontend:
    ports: !reset []
  signal-engine-backend:
    ports: !reset []
    environment: *secure-backend-env
  market-data-frontend:
    ports: !reset []
  market-data-backend:
    ports: !reset []
    environment: *secure-backend-env
  execution-backend:
    ports: !reset []
    environment: *secure-backend-env
  accounts-backend:
    ports: !reset []
    environment:
      <<: *secure-backend-env
      # Behind Caddy the socket peer is the proxy, so the per-IP login/signup
      # limits must read the real client from X-Forwarded-For (Caddy sets it).
      TRUST_FORWARDED_FOR: "true"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      # Caddyfile reads {$VPS_DOMAIN} - Caddy substitutes env vars into a
      # Caddyfile at load time, same mechanism docker-compose itself uses
      # for ${VAR} here.
      VPS_DOMAIN: ${VPS_DOMAIN}
    ports:
      # 80 is required for Caddy's ACME HTTP-01 challenge (issuing/renewing
      # the Let's Encrypt cert) even though nothing in this app uses it
      # directly. (This VPS briefly also ran its own nginx on port 80 for
      # unrelated sites - agentpro.co.in/rgp.agentpro.co.in - found live
      # 2026-09-21; decommissioned rather than worked around, since nothing
      # on it was still in use - see infra/caddy/Caddyfile's git history if
      # that workaround (Caddy on 8078 + an nginx forwarding rule) is ever
      # needed again on a box that DOES still need nginx for something
      # else.) The rest mirror every *_PORT in .env - add a matching block
      # to infra/caddy/Caddyfile AND a line here if a new service ever gets
      # its own port.
      - "80:80"
      # SHELL_PORT still names the variable (unchanged in .env) - it's "the
      # default URL"'s port number that stays put, only what's behind it
      # changed (web-frontend, not shell - see infra/caddy/Caddyfile).
      - "${SHELL_PORT}:${SHELL_PORT}"
      - "${SIGNAL_ENGINE_BACKEND_PORT}:${SIGNAL_ENGINE_BACKEND_PORT}"
      - "${MARKET_DATA_FRONTEND_PORT}:${MARKET_DATA_FRONTEND_PORT}"
      - "${MARKET_DATA_BACKEND_PORT}:${MARKET_DATA_BACKEND_PORT}"
      - "${EXECUTION_BACKEND_PORT}:${EXECUTION_BACKEND_PORT}"
      - "${ACCOUNTS_BACKEND_PORT}:${ACCOUNTS_BACKEND_PORT}"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Cert storage - MUST persist across restarts. Let's Encrypt rate-
      # limits certificate requests per hostname; losing this volume and
      # re-issuing repeatedly can trip that limit.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web-frontend
      - signal-engine-backend
      - market-data-frontend
      - market-data-backend

volumes:
  caddy-data:
  caddy-config:
