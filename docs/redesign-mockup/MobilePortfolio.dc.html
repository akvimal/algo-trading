<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mobile - Portfolio</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1319;--s1:#151b23;--s2:#1c2430;--line:#2a3442;--tx:#e9eef5;--mu:#95a3b5;--ac:#6aa9ff;--up:#4fd3a8;--dn:#ff8b6e;--warn:#f4c15a}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:14px}
*{box-sizing:border-box}
.num{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.up{color:var(--up)}.dn{color:var(--dn)}.mu{color:var(--mu)}
.card{background:var(--s1);border:1px solid var(--line);border-radius:12px}
.lbl{font-size:12px;color:var(--mu)}
.chip{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:6px;font-size:12px;font-weight:600;background:var(--s2);border:1px solid var(--line);white-space:nowrap}
.chip.warn{background:#332a12;border-color:#5b4a1c;color:var(--warn)}
button{font:inherit;color:inherit;cursor:pointer}
.seg{display:flex;background:var(--s1);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{flex:1;height:36px;border:0;border-radius:7px;background:transparent;color:var(--mu);font-size:13px;font-weight:500}
.seg button.on{background:#26344a;color:#fff}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; overflow: hidden; background: var(--bg)">
  <div style="flex-grow: 1; min-height: 0; padding: 14px 16px 0; display: flex; flex-direction: column; gap: 12px; overflow: hidden">
    <header style="display: flex; align-items: center; justify-content: space-between; height: 40px">
      <h1 style="margin: 0; font-size: 22px; font-weight: 600">Portfolio</h1>
      <span class="chip warn">Illustrative data</span>
    </header>
    <div class="seg"><button class="on">Overview</button><button>Positions</button><button>History</button></div>

    <section class="card" style="padding: 14px 16px">
      <div class="lbl">Paper account equity</div>
      <div class="num" style="font-size: 32px; font-weight: 500; margin-top: 2px">₹10,42,380</div>
      <div class="num up" style="font-size: 13px">▲ +₹42,380 (+4.24%) <span class="lbl">vs NIFTY +1.8%</span></div>
      <svg width="100%" height="64" viewBox="0 0 300 64" preserveAspectRatio="none" style="display: block; margin-top: 10px">
        <polyline points="{{nifty}}" fill="none" stroke="#8fa0b5" stroke-width="1.5" stroke-dasharray="5 4" vector-effect="non-scaling-stroke"/>
        <polyline points="{{equity}}" fill="none" stroke="#4fd3a8" stroke-width="2.25" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
      </svg>
    </section>

    <section style="display: flex; gap: 8px">
      <div class="card" style="flex: 1; padding: 10px 12px"><div class="lbl">Max drawdown</div><div class="num dn" style="font-weight: 500; font-size: 16px; margin-top: 2px">−6.2%</div></div>
      <div class="card" style="flex: 1; padding: 10px 12px"><div class="lbl">Win rate</div><div class="num" style="font-weight: 500; font-size: 16px; margin-top: 2px">59%</div></div>
      <div class="card" style="flex: 1; padding: 10px 12px"><div class="lbl">Expectancy</div><div class="num up" style="font-weight: 500; font-size: 16px; margin-top: 2px">+0.42R</div></div>
    </section>

    <section class="card" style="padding: 14px 16px; background: #10233a; border-color: #244468">
      <div style="display: flex; justify-content: space-between; align-items: center">
        <div style="font-size: 14px; font-weight: 600">Graduation to live trading</div><span class="chip warn">3 of 5</span>
      </div>
      <div style="height: 6px; border-radius: 3px; background: #1d3a5c; margin: 10px 0 8px"><div style="width: 60%; height: 6px; border-radius: 3px; background: #4fd3a8"></div></div>
      <div class="lbl" style="color: #a9c4e6; line-height: 1.5">Still needed: 8 more trades (22 of 30) and 3 unreviewed trades.</div>
      <button disabled style="width: 100%; height: 44px; margin-top: 10px; border-radius: 10px; border: 1px solid #244468; background: #16304f; color: #7f9cc2; font-weight: 600; cursor: not-allowed">Unlock live trading</button>
    </section>

    <section style="display: flex; flex-direction: column; gap: 8px">
      <div style="font-size: 14px; font-weight: 600">Recent fills</div>
      <div class="card" style="padding: 4px 14px">
        <div style="display: flex; align-items: center; height: 46px; gap: 8px"><span class="chip">SELL</span><span style="font-weight: 600; flex-grow: 1">INFY</span><span class="num up">+₹1,120</span></div>
        <div style="display: flex; align-items: center; height: 46px; gap: 8px; border-top: 1px solid var(--line)"><span class="chip">SELL</span><span style="font-weight: 600; flex-grow: 1">BANKNIFTY</span><span class="num up">+₹1,640</span></div>
      </div>
    </section>
  </div>
  <dc-import name="MobileNav" active="portfolio" hint-size="390px,76px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const ys = [56, 53, 55, 49, 46, 50, 42, 38, 41, 34, 30, 34, 26, 22, 25, 18, 14, 10, 6, 4];
    const ny = [44, 43, 45, 42, 40, 41, 39, 38, 40, 37, 36, 37, 34, 33, 34, 32, 31, 31, 29, 28];
    const step = 300 / (ys.length - 1);
    const pts = (a) => a.map((y, i) => Math.round(i * step) + ',' + y).join(' ');
    return { equity: pts(ys), nifty: pts(ny) };
  }
}
</script>
</body>
</html>
