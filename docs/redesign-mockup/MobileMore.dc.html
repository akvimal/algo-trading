<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mobile - More</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1319;--s1:#151b23;--s2:#1c2430;--line:#2a3442;--tx:#e9eef5;--mu:#95a3b5;--ac:#6aa9ff;--up:#4fd3a8;--dn:#ff8b6e;--warn:#f4c15a}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:14px}
*{box-sizing:border-box}
.card{background:var(--s1);border:1px solid var(--line);border-radius:12px}
.lbl{font-size:12px;color:var(--mu)}
.chip{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:6px;font-size:12px;font-weight:600;background:var(--s2);border:1px solid var(--line);white-space:nowrap}
.chip.up{background:#0f2a24;border-color:#1d4a3e;color:var(--up)}
.chip.warn{background:#332a12;border-color:#5b4a1c;color:var(--warn)}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; overflow: hidden; background: var(--bg)">
  <div style="flex-grow: 1; min-height: 0; padding: 14px 16px 0; display: flex; flex-direction: column; gap: 14px; overflow: hidden">
    <header style="display: flex; align-items: center; justify-content: space-between; height: 40px">
      <h1 style="margin: 0; font-size: 22px; font-weight: 600">More</h1>
      <span class="chip warn">Illustrative data</span>
    </header>

    <section class="card" style="padding: 4px 14px">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
        <div style="display: flex; align-items: center; gap: 12px; min-height: 56px; border-top: 1px solid {{r.line}}">
          <div style="flex-grow: 1; min-width: 0">
            <div style="font-size: 15px; font-weight: 500">{{r.name}}</div>
            <div class="lbl" style="margin-top: 2px">{{r.sub}}</div>
          </div>
          <sc-if value="{{r.badge}}" hint-placeholder-val="{{ false }}"><span class="chip up">{{r.badge}}</span></sc-if>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#95a3b5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
        </div>
      </sc-for>
    </section>

    <section class="card" style="padding: 14px">
      <div style="font-size: 13px; font-weight: 600">Experience</div>
      <div style="display: flex; padding: 3px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); margin-top: 8px">
        <div style="flex: 1; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 7px; color: var(--mu); font-size: 14px; font-weight: 500">Guided</div>
        <div style="flex: 1; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 7px; background: #26344a; color: #fff; font-size: 14px; font-weight: 500">Pro</div>
      </div>
      <div class="lbl" style="margin-top: 8px; line-height: 1.5">Guided adds plain-English hints and a short lesson to the trade ticket.</div>
    </section>

    <section class="card" style="padding: 14px; display: flex; align-items: center; gap: 12px">
      <div style="flex-grow: 1"><div style="font-size: 14px; font-weight: 600">Plan: Trader</div><div class="lbl" style="margin-top: 2px">Live data and alerts included</div></div>
      <span class="chip">Manage</span>
    </section>

    <a href="MobileSignIn.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 48px; border-radius: 12px; border: 1px solid var(--line); color: #ff8b6e; font-size: 15px; font-weight: 500; text-decoration: none">Sign out</a>
  </div>
  <dc-import name="MobileNav" active="more" hint-size="390px,76px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      rows: [
        { name: 'Review', sub: 'Discipline score, journal and performance', badge: '78', line: 'transparent' },
        { name: 'Automate', sub: 'Strategies, rules and backtests', badge: '', line: '#2a3442' },
        { name: 'Alerts', sub: 'Price and zone alerts, Telegram', badge: '2 new', line: '#2a3442' },
        { name: 'Weekly Advisor', sub: 'Options picks for the week', badge: '', line: '#2a3442' },
        { name: 'Settings', sub: 'Risk limits, broker, billing', badge: '', line: '#2a3442' }
      ]
    };
  }
}
</script>
</body>
</html>
