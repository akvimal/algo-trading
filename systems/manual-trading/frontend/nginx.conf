server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # No /api proxy here - this frontend reads execution's/market-data's/
    # signal-generation's/signal-processing's APIs directly from the
    # browser (CORS-enabled), see src/api.ts.
    location / {
        try_files $uri /index.html;
    }
}
