<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>algo-trading</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0f1216;
    --surface: #171b21;
    --border: #262c35;
    --text: #e6e9ee;
    --text-dim: #8b93a1;
    --accent: #4c8bf5;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
  }
  nav {
    display: flex;
    gap: 0.25rem;
    padding: 0.75rem 1rem 0;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  nav button {
    background: transparent;
    border: none;
    color: var(--text-dim);
    padding: 0.6rem 1rem;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    border-bottom: 2px solid transparent;
  }
  nav button.active {
    color: var(--text);
    border-bottom-color: var(--accent);
  }
  .frame-wrap {
    flex: 1;
    position: relative;
  }
  iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
    display: none;
  }
  iframe.active {
    display: block;
  }
  .placeholder {
    display: none;
    position: absolute;
    inset: 0;
    align-items: center;
    justify-content: center;
    color: var(--text-dim);
    font-size: 0.95rem;
    flex-direction: column;
    gap: 0.5rem;
  }
  .placeholder.active {
    display: flex;
  }
  #dhan-banner {
    display: none;
    padding: 0.5rem 1rem;
    background: #4a2a10;
    color: #ffd8a8;
    font-size: 0.85rem;
    border-bottom: 1px solid var(--border);
  }
  #dhan-banner.active {
    display: block;
  }
</style>
</head>
<body>
  <div id="dhan-banner"></div>
  <nav id="tabs"></nav>
  <div class="frame-wrap" id="frame-wrap"></div>

  <script>
    // Ports below are DEV's *_FRONTEND_PORT values (see .env) - edit here
    // if you changed those. A second local stack (e.g. .env.test, see
    // CLAUDE.md's "Two isolated local container groups") shifts every
    // port by the same fixed offset (dev+1000), so this shell - one
    // static file, no per-stack build step - derives the real ports at
    // runtime from its OWN port rather than hardcoding a single stack's
    // values twice: shell itself is on 8090 for dev / 9090 for test, so
    // comparing that to its own dev reference (8090) gives the same
    // offset to apply to every tab below. This is what makes test's
    // shell (:9090) actually show test's frontends instead of silently
    // iframing dev's - a real bug this offset math replaces.
    const SHELL_DEV_PORT = 8090;
    const PORT_OFFSET = (Number(location.port) || SHELL_DEV_PORT) - SHELL_DEV_PORT;

    // Same offset that fixed the iframe ports above also tells us which
    // stack this is - visible in the browser tab so dev/test (identical
    // UI otherwise) can't be confused for each other again.
    document.title = `algo-trading [${PORT_OFFSET === 0 ? "DEV" : "TEST"}]`;

    const TABS = [
      { id: "signal-generation", label: "Signal Generation", port: 8082, built: true },
      { id: "signal-processing", label: "Signal Processing", port: 8080, built: true },
      { id: "execution", label: "Execution", port: 8081, built: true },
      { id: "market-data", label: "Market Data", port: 8083, built: true },
    ];

    const tabsEl = document.getElementById("tabs");
    const frameWrap = document.getElementById("frame-wrap");

    TABS.forEach((tab, i) => {
      const btn = document.createElement("button");
      btn.textContent = tab.label;
      btn.className = i === 0 ? "active" : "";
      btn.dataset.tab = tab.id;
      btn.onclick = () => activate(tab.id);
      tabsEl.appendChild(btn);

      if (tab.built) {
        const iframe = document.createElement("iframe");
        iframe.src = `http://${location.hostname}:${tab.port + PORT_OFFSET}`;
        iframe.id = `frame-${tab.id}`;
        iframe.className = i === 0 ? "active" : "";
        // Without this, navigator.clipboard.writeText() in the iframed
        // frontend fails silently (e.g. the "copy webhook URL" buttons).
        iframe.allow = "clipboard-write";
        frameWrap.appendChild(iframe);
      } else {
        const placeholder = document.createElement("div");
        placeholder.className = `placeholder${i === 0 ? " active" : ""}`;
        placeholder.id = `frame-${tab.id}`;
        placeholder.innerHTML =
          `<strong>${tab.label}</strong><span>Not built yet - see systems/${tab.id}/README.md</span>`;
        frameWrap.appendChild(placeholder);
      }
    });

    function activate(id) {
      document.querySelectorAll("nav button").forEach((b) => b.classList.toggle("active", b.dataset.tab === id));
      document
        .querySelectorAll(".frame-wrap > *")
        .forEach((el) => el.classList.toggle("active", el.id === `frame-${id}`));
    }

    // Dhan access-token expiry banner - the NSE/MCX in-house engine (and
    // any Dhan quote call) 401s the instant this token expires, but
    // nothing else surfaces that until a signal silently fails to
    // generate. market-data's GET /dhan/token-status now decodes the
    // token's own JWT `exp` claim (see app/providers/dhan.py), so this
    // polls that directly rather than duplicating the decode here.
    const MARKET_DATA_BACKEND_PORT = 8001;
    const DHAN_WARNING_WINDOW_MS = 60 * 60 * 1000; // 1 hour
    const DHAN_POLL_INTERVAL_MS = 5 * 60 * 1000; // 5 minutes
    const bannerEl = document.getElementById("dhan-banner");

    async function checkDhanTokenExpiry() {
      const base = `http://${location.hostname}:${MARKET_DATA_BACKEND_PORT + PORT_OFFSET}`;
      let status;
      try {
        const res = await fetch(`${base}/dhan/token-status`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        status = await res.json();
      } catch {
        // market-data unreachable - not this banner's job to report that.
        bannerEl.classList.remove("active");
        return;
      }

      if (!status.token_expires_at) {
        bannerEl.classList.remove("active");
        return;
      }

      const msRemaining = new Date(status.token_expires_at).getTime() - Date.now();
      if (msRemaining > DHAN_WARNING_WINDOW_MS) {
        bannerEl.classList.remove("active");
        return;
      }

      bannerEl.textContent =
        msRemaining <= 0
          ? "Dhan access token has EXPIRED - NSE/MCX signal generation and quotes are down until it's renewed (Market Data tab > Data provider keys)."
          : `Dhan access token expires in ${Math.round(msRemaining / 60000)} min - renew it soon (Market Data tab > Data provider keys) to avoid an NSE/MCX outage.`;
      bannerEl.classList.add("active");
    }

    checkDhanTokenExpiry();
    setInterval(checkDhanTokenExpiry, DHAN_POLL_INTERVAL_MS);
  </script>
</body>
</html>
