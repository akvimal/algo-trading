<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TradeRight</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0f1216;
    --surface: #171b21;
    --border: #262c35;
    --text: #e6e9ee;
    --text-dim: #8b93a1;
    --accent: #4c8bf5;
    --buy: #3ecf8e;
    --sell: #e8586a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
  }
  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding: 0.75rem 1rem 0;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  nav {
    display: flex;
    gap: 0.25rem;
  }
  nav button {
    background: transparent;
    border: none;
    color: var(--text-dim);
    padding: 0.6rem 1rem;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    border-bottom: 2px solid transparent;
  }
  nav button.active {
    color: var(--text);
    border-bottom-color: var(--accent);
  }
  /* Groups the user-identity display and the notification bell into one
     right-hand cluster, so top-bar (space-between) still only has two
     direct children - nav on the left, this on the right - regardless of
     how many things live inside it. */
  .top-bar-right {
    display: flex;
    align-items: center;
    gap: 1rem;
    flex-shrink: 0;
  }
  /* One global username/logout display instead of a per-module copy
     (moved from execution's Nav/manual-trading's/market-data's own Dhan
     panel) - it's the same underlying session (see the shared-token
     broker below) regardless of which tab happens to be active, so it
     belongs up here, not duplicated per tab. Empty (no children) when
     nobody's logged in anywhere - collapses to nothing via :empty rather
     than showing a placeholder. */
  .user-area {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding-bottom: 0.6rem;
    font-size: 0.82rem;
  }
  .user-area:empty {
    display: none;
  }
  .user-name {
    color: var(--text-dim);
  }
  .admin-badge {
    background: var(--accent);
    color: #0f1216;
    font-size: 0.68rem;
    font-weight: 700;
    padding: 0.15rem 0.4rem;
    border-radius: 999px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .user-logout-btn {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-dim);
    font-size: 0.78rem;
    padding: 0.25rem 0.6rem;
    cursor: pointer;
  }
  .user-logout-btn:hover {
    color: var(--text);
    border-color: var(--text-dim);
  }
  /* One global notification bell instead of a per-module copy (moved
     from signal-engine's/manual-trading's own top rows) - it's the same
     underlying feature (new signal, across every strategy) regardless of
     which tab happens to be active, so it belongs up here, not
     duplicated per tab. Dropdown-on-click (2026-09-21, see the last-5
     history feature) - same absolute-positioned-panel + click-outside/
     Escape-to-close pattern the old "OI ticker settings" gear used
     (removed 2026-09-21, see git history around 4d15089/4319e3a) -
     consolidates what used to be two separate controls (the bell's own
     instant-toggle click, the Sound checkbox sitting bare in the header)
     into one panel, now joined by the enable checkbox and the last-5
     notification history. */
  .notif-settings {
    position: relative;
    padding-bottom: 0.6rem;
    flex-shrink: 0;
  }
  #notif-toggle {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 1rem;
    line-height: 1;
    padding: 0.35rem 0.55rem;
    cursor: pointer;
  }
  #notif-toggle:hover,
  #notif-toggle.active {
    border-color: var(--text-dim);
  }
  .notif-settings-menu {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    position: absolute;
    top: 100%;
    right: 0;
    margin-top: 0.4rem;
    padding: 0.6rem 0.75rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
    font-size: 0.8rem;
    color: var(--text-dim);
    white-space: nowrap;
    z-index: 20;
  }
  /* Same cascade-order trick as the old .oi-settings-menu[hidden] - wins
     the display tie over the flex rule above by appearing later. */
  .notif-settings-menu[hidden] {
    display: none;
  }
  .notif-settings-row,
  .notif-sound-label {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    cursor: pointer;
    font-size: 0.78rem;
    color: var(--text-dim);
  }
  .notif-settings-row input,
  .notif-sound-label input {
    margin: 0;
  }
  .notif-sound-label.dim {
    opacity: 0.5;
    pointer-events: none;
  }
  #notif-blocked {
    display: none;
    font-size: 0.72rem;
    color: #e8586a;
    max-width: 16rem;
    white-space: normal;
  }
  #notif-blocked.active {
    display: block;
  }
  .notif-history {
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
    border-top: 1px solid var(--border);
    padding-top: 0.5rem;
    width: 26rem;
    max-width: 80vw;
    max-height: 70vh;
    overflow-y: auto;
  }
  .notif-history-empty {
    color: var(--text-dim);
    font-size: 0.75rem;
    font-style: italic;
  }
  .notif-history-item {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 0.1rem;
    background: transparent;
    border: none;
    border-radius: 4px;
    padding: 0.3rem 0.4rem;
    cursor: pointer;
    text-align: left;
    white-space: normal;
    color: inherit;
    font: inherit;
  }
  .notif-history-item:hover {
    background: var(--surface-raised, #1a1f27);
  }
  .notif-history-title {
    color: var(--text);
    font-weight: 600;
    font-size: 0.78rem;
  }
  .notif-history-body {
    color: var(--text-dim);
    font-size: 0.74rem;
  }
  .notif-history-time {
    color: var(--text-dim);
    font-size: 0.68rem;
    opacity: 0.8;
  }
  .frame-wrap {
    flex: 1;
    position: relative;
  }
  iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
    display: none;
  }
  iframe.active {
    display: block;
  }
  .placeholder {
    display: none;
    position: absolute;
    inset: 0;
    align-items: center;
    justify-content: center;
    color: var(--text-dim);
    font-size: 0.95rem;
    flex-direction: column;
    gap: 0.5rem;
  }
  .placeholder.active {
    display: flex;
  }
  #dhan-banner {
    display: none;
    padding: 0.5rem 1rem;
    background: #4a2a10;
    color: #ffd8a8;
    font-size: 0.85rem;
    border-bottom: 1px solid var(--border);
  }
  #dhan-banner.active {
    display: block;
  }
</style>
</head>
<body>
  <div id="dhan-banner"></div>
  <div class="top-bar">
    <nav id="tabs"></nav>
    <div class="top-bar-right">
      <div class="user-area" id="user-area"></div>
      <div class="notif-settings" id="notif-settings">
        <button type="button" id="notif-toggle" aria-haspopup="true"></button>
        <div class="notif-settings-menu" id="notif-settings-menu" hidden>
          <label class="notif-settings-row">
            <input type="checkbox" id="notif-enabled" />
            Notifications
          </label>
          <label class="notif-sound-label" id="notif-sound-label">
            <input type="checkbox" id="notif-sound" />
            Sound
          </label>
          <span id="notif-blocked"></span>
          <div class="notif-history" id="notif-history"></div>
        </div>
      </div>
    </div>
  </div>
  <div class="frame-wrap" id="frame-wrap"></div>

  <script>
    // Ports below are DEV's *_FRONTEND_PORT values (see .env) - edit here
    // if you changed those. A second local stack (e.g. .env.test, see
    // CLAUDE.md's "Two isolated local container groups") shifts every
    // port by the same fixed offset (dev+1000), so this shell - one
    // static file, no per-stack build step - derives the real ports at
    // runtime from its OWN port rather than hardcoding a single stack's
    // values twice: shell itself is on 8090 for dev / 9090 for test, so
    // comparing that to its own dev reference (8090) gives the same
    // offset to apply to every tab below. This is what makes test's
    // shell (:9090) actually show test's frontends instead of silently
    // iframing dev's - a real bug this offset math replaces.
    const SHELL_DEV_PORT = 8090;
    const PORT_OFFSET = (Number(location.port) || SHELL_DEV_PORT) - SHELL_DEV_PORT;

    // Local dev/test are always plain http: (no TLS locally). A domain
    // deploy behind Caddy (see docker-compose.prod.yml) terminates TLS on
    // these same ports, so every cross-origin URL below - each iframe src
    // and every fetch base - has to follow the PAGE's own scheme rather
    // than hardcoding http:, or the browser blocks them all as mixed
    // content the instant this shell itself is loaded over https:.
    const PROTOCOL = location.protocol === "https:" ? "https:" : "http:";

    // Environment tag in the browser tab. On localhost this is one of the
    // two local stacks (dev / .env.test, identical UI) - tell them apart
    // by the same PORT_OFFSET used for iframe routing above. Any other
    // host is the single deployed stack -> [LIVE]. (The deploy reuses the
    // dev port numbers, so PORT_OFFSET is 0 there and the old check
    // mislabelled the VPS as [DEV].)
    const _host = location.hostname;
    const _isLocal = _host === "localhost" || _host === "127.0.0.1" || _host === "::1" || _host === "[::1]";
    document.title = `TradeRight [${!_isLocal ? "LIVE" : PORT_OFFSET === 0 ? "DEV" : "TEST"}]`;

    // `path` (optional) is appended to the iframe src only - dataset.origin
    // below stays the bare origin (the session broker's postMessage
    // targetOrigin check needs that). manual-trading is embedded twice:
    // once as "Intraday" (its default page) and once as "OI" (its Options
    // OI page, ?tab=oi) - two top-level menu entries for what used to be
    // that frontend's own in-app tab switch, now that its top bar is gone.
    const TABS = [
      { id: "signal-engine", label: "Algo Trading", port: 8085, built: true },
      { id: "manual-trading", label: "Intraday", port: 8084, built: true },
      { id: "manual-trading-oi", label: "OI", port: 8084, built: true, path: "/?tab=oi" },
      { id: "manual-trading-performance", label: "Performance", port: 8084, built: true, path: "/?tab=performance" },
      { id: "manual-trading-alerts", label: "Alerts", port: 8084, built: true, path: "/?tab=alerts" },
      { id: "manual-trading-discipline", label: "Discipline", port: 8084, built: true, path: "/?tab=discipline" },
      { id: "execution", label: "Money", port: 8081, built: true },
      { id: "market-data", label: "Market Data", port: 8083, built: true },
    ];

    const tabsEl = document.getElementById("tabs");
    const frameWrap = document.getElementById("frame-wrap");

    TABS.forEach((tab, i) => {
      const btn = document.createElement("button");
      btn.textContent = tab.label;
      btn.className = i === 0 ? "active" : "";
      btn.dataset.tab = tab.id;
      btn.onclick = () => activate(tab.id);
      tabsEl.appendChild(btn);

      if (tab.built) {
        const iframe = document.createElement("iframe");
        const origin = `${PROTOCOL}//${location.hostname}:${tab.port + PORT_OFFSET}`;
        iframe.src = origin + (tab.path ?? "");
        iframe.dataset.origin = origin; // read back by the session broker below
        iframe.id = `frame-${tab.id}`;
        iframe.className = i === 0 ? "active" : "";
        // clipboard-write: navigator.clipboard.writeText() in the iframed
        // frontend fails silently without it (e.g. "copy webhook URL").
        // notifications: lets a frontend fire a desktop Notification of its
        // own (manual-trading's Live Chart does, for a new trade setup) -
        // Chrome otherwise blocks the constructor in a cross-origin frame,
        // even though this top-level origin already holds the permission.
        iframe.allow = "clipboard-write; notifications";
        frameWrap.appendChild(iframe);
      } else {
        const placeholder = document.createElement("div");
        placeholder.className = `placeholder${i === 0 ? " active" : ""}`;
        placeholder.id = `frame-${tab.id}`;
        placeholder.innerHTML =
          `<strong>${tab.label}</strong><span>Not built yet - see systems/${tab.id}/README.md</span>`;
        frameWrap.appendChild(placeholder);
      }
    });

    // --- Shared login session across all embedded frontends ---------------
    // Each frontend is its own browser origin (different port), so logging
    // in on one doesn't carry over to another by default - each keeps its
    // own separate localStorage session (a documented gap, see CLAUDE.md).
    // The shell is the one place all of them are already embedded
    // together, so it acts as the session broker: holds one shared copy of
    // the token, hands it to any iframe that asks (on load, before it would
    // otherwise show a login screen), and rebroadcasts it to every OTHER
    // iframe the instant any one of them logs in or out. Each frontend's
    // own auth.ts opts into this (duplicated per-frontend, not shared code,
    // same convention as everything else under systems/*) - a frontend
    // that never sends "request-token"/"auth-token" would simply be
    // unaffected (every embedded module opts in today).
    const SHARED_TOKEN_KEY = "algoTradingSharedAuthToken";

    function getSharedToken() {
      return localStorage.getItem(SHARED_TOKEN_KEY);
    }

    function setSharedToken(token) {
      if (token) localStorage.setItem(SHARED_TOKEN_KEY, token);
      else localStorage.removeItem(SHARED_TOKEN_KEY);
    }

    function broadcastToken(token, excludeWindow) {
      document.querySelectorAll(".frame-wrap iframe").forEach((iframe) => {
        if (iframe.contentWindow && iframe.contentWindow !== excludeWindow) {
          iframe.contentWindow.postMessage({ source: "algo-trading-shell", type: "auth-token", token }, iframe.dataset.origin);
        }
      });
    }

    const iframeOrigins = new Set(Array.from(document.querySelectorAll(".frame-wrap iframe")).map((f) => f.dataset.origin));

    window.addEventListener("message", (event) => {
      const data = event.data;
      // Only ever a plain object we recognize, from one of our own
      // embedded iframes - never acted on for any other message shape or
      // origin (e.g. a browser extension, or something else entirely).
      if (!data || data.source !== "algo-trading-app" || !iframeOrigins.has(event.origin)) return;

      if (data.type === "request-token") {
        event.source.postMessage({ source: "algo-trading-shell", type: "auth-token", token: getSharedToken() }, event.origin);
      } else if (data.type === "auth-token") {
        setSharedToken(data.token);
        broadcastToken(data.token, event.source);
        refreshUserArea();
      } else if (data.type === "navigate-oi" && typeof data.symbol === "string") {
        // Live Chart's "OI Analysis" link - same jump the sentiment
        // badges used to (goToOiTab), but requested from inside the
        // Intraday iframe rather than clicked here in the shell header.
        goToOiTab(data.symbol);
      } else if (data.type === "navigate-intraday" && typeof data.symbol === "string") {
        // The OI page's "Intraday Chart" link - the reverse jump.
        goToIntradayTab(data.symbol);
      } else if (data.type === "navigate-discipline") {
        // Performance page's "Discipline score" link - the header badge
        // that used to also fire this was moved into the Intraday page's
        // own tab bar 2026-09-21 (see LiveChartPage.tsx).
        activate("manual-trading-discipline");
      }
    });

    // --- Global username/logout display -------------------------------
    // Reads the very same shared token the broker above already holds
    // (this IS the shell's own origin, so no postMessage round-trip is
    // needed here) and shows who's logged in - once, for every module,
    // instead of each frontend repeating its own "email + Logout" row
    // (moved out of execution's Nav, manual-trading's top row, and
    // market-data's Dhan panel - see each of their own comments). Any
    // ONE frontend logging in is enough to populate this, since the
    // broker above already keeps localStorage and every iframe in sync.
    const ACCOUNTS_BACKEND_PORT = 8004;
    const userAreaEl = document.getElementById("user-area");

    async function fetchAccountUser(token) {
      const base = `${PROTOCOL}//${location.hostname}:${ACCOUNTS_BACKEND_PORT + PORT_OFFSET}`;
      const res = await fetch(`${base}/auth/me`, { headers: { Authorization: `Bearer ${token}` } });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return res.json(); // { id, email, name, is_admin }
    }

    function renderUserArea(user) {
      userAreaEl.innerHTML = "";
      if (!user) return;

      const nameSpan = document.createElement("span");
      nameSpan.className = "user-name";
      // Pre-name accounts (signed up before this field existed) fall back
      // to email so the bar never renders empty.
      nameSpan.textContent = user.name || user.email;
      userAreaEl.appendChild(nameSpan);

      if (user.is_admin) {
        const badge = document.createElement("span");
        badge.className = "admin-badge";
        badge.textContent = "Admin";
        userAreaEl.appendChild(badge);
      }

      const logoutBtn = document.createElement("button");
      logoutBtn.type = "button";
      logoutBtn.className = "user-logout-btn";
      logoutBtn.textContent = "Logout";
      logoutBtn.onclick = () => {
        // Nobody else initiated this (unlike a frontend's own Logout
        // button, this isn't "one of the iframes" logging itself out) -
        // every iframe needs telling, no exclusion.
        setSharedToken(null);
        broadcastToken(null);
        renderUserArea(null);
      };
      userAreaEl.appendChild(logoutBtn);
    }

    async function refreshUserArea() {
      const token = getSharedToken();
      if (!token) {
        renderUserArea(null);
        return;
      }
      try {
        renderUserArea(await fetchAccountUser(token));
      } catch {
        // Expired/invalid - treat as logged out rather than leaving a
        // stale display, and clear the bad token so a frontend's own
        // AuthGate doesn't keep trying it either.
        setSharedToken(null);
        renderUserArea(null);
      }
    }

    refreshUserArea();

    function activate(id) {
      document.querySelectorAll("nav button").forEach((b) => b.classList.toggle("active", b.dataset.tab === id));
      document
        .querySelectorAll(".frame-wrap > *")
        .forEach((el) => el.classList.toggle("active", el.id === `frame-${id}`));
      // Every tab's iframe is created up front and just toggled between
      // display:none/block above - never torn down/recreated - so a chart
      // living in one (manual-trading's Live Chart) can miss its own
      // ResizeObserver firing on that transition (ticks/LTP keep updating
      // fine since that's plain text; only the canvas paint gets stuck -
      // reproduced live on a higher-latency host, timing-sensitive rather
      // than every time). Nudge the newly-active tab's iframe to resize its
      // own chart explicitly rather than relying solely on that observer -
      // ignored by any iframe with no listener for it (every tab but Live
      // Chart today).
      const activeIframe = document.getElementById(`frame-${id}`);
      if (activeIframe && activeIframe.tagName === "IFRAME" && activeIframe.contentWindow && activeIframe.dataset.origin) {
        activeIframe.contentWindow.postMessage({ source: "algo-trading-shell", type: "tab-activated" }, activeIframe.dataset.origin);
      }
    }

    // Dhan access-token expiry banner - the NSE/MCX in-house engine (and
    // any Dhan quote call) 401s the instant this token expires, but
    // nothing else surfaces that until a signal silently fails to
    // generate. market-data's GET /dhan/token-expiry decodes the token's
    // own JWT `exp` claim (see app/providers/dhan.py), so this polls that
    // directly rather than duplicating the decode here. Deliberately NOT
    // /dhan/token-status - that route requires a real admin JWT (see
    // dhan.py's own router split), which the shell has no way to supply
    // (it's a plain static nav page, not one of the SaaS-gated frontends)
    // - this banner silently never fired for ~2 weeks (discovered live
    // 2026-08-29) because that 401 got swallowed right below as "market-
    // data unreachable", same as any other fetch failure.
    const MARKET_DATA_BACKEND_PORT = 8001;
    const DHAN_WARNING_WINDOW_MS = 60 * 60 * 1000; // 1 hour
    const DHAN_POLL_INTERVAL_MS = 5 * 60 * 1000; // 5 minutes
    const bannerEl = document.getElementById("dhan-banner");

    async function checkDhanTokenExpiry() {
      const base = `${PROTOCOL}//${location.hostname}:${MARKET_DATA_BACKEND_PORT + PORT_OFFSET}`;
      let status;
      try {
        const res = await fetch(`${base}/dhan/token-expiry`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        status = await res.json();
      } catch {
        // market-data unreachable - not this banner's job to report that.
        bannerEl.classList.remove("active");
        return;
      }

      if (!status.token_expires_at) {
        bannerEl.classList.remove("active");
        return;
      }

      const msRemaining = new Date(status.token_expires_at).getTime() - Date.now();
      if (msRemaining > DHAN_WARNING_WINDOW_MS) {
        bannerEl.classList.remove("active");
        return;
      }

      bannerEl.textContent =
        msRemaining <= 0
          ? "Dhan access token has EXPIRED - NSE/MCX signal generation and quotes are down until it's renewed (Market Data tab > Data provider keys)."
          : `Dhan access token expires in ${Math.round(msRemaining / 60000)} min - renew it soon (Market Data tab > Data provider keys) to avoid an NSE/MCX outage.`;
      bannerEl.classList.add("active");
    }

    checkDhanTokenExpiry();
    setInterval(checkDhanTokenExpiry, DHAN_POLL_INTERVAL_MS);

    // --- Cross-frontend OI/Intraday navigation --------------------------
    // goToOiTab/goToIntradayTab used to also back the shell's own global
    // sentiment badge bar (a badge click jumped to that symbol's OI tab).
    // That bar moved into manual-trading's Intraday page itself as a
    // per-instrument-tab glyph (2026-09-21, see LiveChartPage.tsx's
    // sentimentBySymbol) - contextual to the tab it's about, instead of an
    // always-on strip that cost every other shell tab header space too.
    // These two functions stay: they're also each frontend's own
    // "navigate-oi"/"navigate-intraday" postMessage jump (Live Chart's "OI
    // Analysis" link and the OI page's "Intraday Chart" link, handled
    // below in the message listener), unrelated to that badge bar.

    // Jumps straight to the OI menu tab (its own iframe of the
    // manual-trading frontend, loaded at ?tab=oi), pre-selected to this
    // asset - same "reload the iframe at a deep-link URL" mechanism every
    // other cross-frontend link in this codebase already uses (e.g.
    // ?signal_id= between the other frontends' own src/links.ts), not a
    // postMessage - manual-trading's App.tsx/OiSummaryPage.tsx both only
    // ever read tab/symbol once at mount (see their own comments), so a
    // real navigation (not a live message while already mounted) is what
    // actually takes effect. Only ever reassigns .src, never
    // dataset.origin - the session broker's own postMessage targetOrigin
    // check needs that to stay a bare origin, not a full URL with a
    // query string.
    function goToOiTab(symbol) {
      activate("manual-trading-oi");
      const iframe = document.getElementById("frame-manual-trading-oi");
      if (!iframe || !iframe.dataset.origin) return;
      iframe.src = `${iframe.dataset.origin}/?tab=oi&symbol=${encodeURIComponent(symbol)}`;
    }

    // Mirror of goToOiTab in the other direction - the "Intraday Chart"
    // link on the OI page. Same iframe-reload-at-a-deep-link mechanism
    // (LiveChartPage reads ?symbol= once at mount).
    function goToIntradayTab(symbol) {
      activate("manual-trading");
      const iframe = document.getElementById("frame-manual-trading");
      if (!iframe || !iframe.dataset.origin) return;
      iframe.src = `${iframe.dataset.origin}/?symbol=${encodeURIComponent(symbol)}`;
    }

    // --- Global signal-notification bell ------------------------------------
    // Ported from signal-engine's/manual-trading's own (duplicated)
    // SignalNotifier.tsx React component into plain JS here, since it's the
    // same underlying feature (desktop notification + sound for a new
    // signal, across every strategy) regardless of which tab is active - one
    // bell in the shell's own top bar instead of one copy per module.
    // Requires a secure context (HTTPS, or localhost's explicit exception) -
    // silently no-ops (button stays hidden) if window.Notification isn't
    // available at all. localStorage keys are new here (the shell's own
    // origin never held this preference before) - a user who'd already
    // enabled it in the old per-module UI needs to re-enable it once here.
    const SIGNAL_ENGINE_BACKEND_PORT = 8000;
    const NOTIF_POLL_MS = 5000;
    const NOTIF_ENABLED_KEY = "signalNotificationsEnabled";
    const NOTIF_SOUND_KEY = "signalNotificationSoundEnabled";
    // Last-5 history (2026-09-21, GitHub issue #1) - localStorage, not a
    // backend table (see the issue's own "Probable fix" for why: shell is
    // a single static file with no backend of its own, and everything it
    // already tracks here is localStorage-backed the same way). Keeps
    // more than it shows (NOTIF_HISTORY_KEEP) so trimming the visible
    // count later doesn't need a schema change, just a slice.
    const NOTIF_HISTORY_KEY = "signalNotificationHistory";
    const NOTIF_HISTORY_KEEP = 20;
    const NOTIF_HISTORY_SHOW = 10;
    const notifSupported = typeof window !== "undefined" && "Notification" in window;
    const notifSettingsEl = document.getElementById("notif-settings");
    const notifToggleEl = document.getElementById("notif-toggle");
    const notifSettingsMenuEl = document.getElementById("notif-settings-menu");
    const notifEnabledCheckboxEl = document.getElementById("notif-enabled");
    const notifSoundLabelEl = document.getElementById("notif-sound-label");
    const notifSoundCheckboxEl = document.getElementById("notif-sound");
    const notifBlockedEl = document.getElementById("notif-blocked");
    const notifHistoryEl = document.getElementById("notif-history");

    if (notifSupported) {
      let notifEnabled = localStorage.getItem(NOTIF_ENABLED_KEY) === "true" && Notification.permission === "granted";
      let notifSoundEnabled = localStorage.getItem(NOTIF_SOUND_KEY) !== "false";
      // null = not seeded yet - the first poll after enabling only records
      // what's already there, it never fires N notifications for
      // pre-existing history just because notifications were switched on.
      let seenIds = null;
      let strategyNames = new Map();
      let audioCtx = null;

      function loadNotifHistory() {
        try {
          const raw = JSON.parse(localStorage.getItem(NOTIF_HISTORY_KEY) ?? "[]");
          return Array.isArray(raw) ? raw : [];
        } catch {
          return [];
        }
      }
      let notifHistory = loadNotifHistory();

      // `entry.tag` is the jump target for a click in the history list
      // below - a signal_id for a signal, the bare symbol for a sentiment
      // change (not `sentiment-${symbol}`, unlike the desktop
      // Notification's own `tag` a few lines below - these are two
      // different tags for two different purposes, they don't need to
      // match).
      function pushNotifHistory(entry) {
        notifHistory = [entry, ...notifHistory].slice(0, NOTIF_HISTORY_KEEP);
        try {
          localStorage.setItem(NOTIF_HISTORY_KEY, JSON.stringify(notifHistory));
        } catch {
          // storage disabled/full - the entry still shows for this session,
          // just won't survive a refresh
        }
        renderNotifHistory();
      }

      function relTime(at) {
        const mins = Math.round((Date.now() - at) / 60000);
        if (mins < 1) return "just now";
        if (mins < 60) return `${mins}m ago`;
        const hrs = Math.round(mins / 60);
        if (hrs < 24) return `${hrs}h ago`;
        return `${Math.round(hrs / 24)}d ago`;
      }

      // The reverse of goToOiTab/goToIntradayTab's own iframe-reload
      // mechanism, reused here for a history entry's own jump - a signal
      // opens signal-engine's Signals tab at the same ?tab=signals&
      // signal_id= deep link its own crosslinks already use (see
      // App.tsx); a sentiment entry reuses goToOiTab directly.
      function jumpToNotifEntry(entry) {
        if (entry.type === "sentiment") {
          goToOiTab(entry.tag);
        } else if (entry.type === "signal") {
          activate("signal-engine");
          const iframe = document.getElementById("frame-signal-engine");
          if (iframe && iframe.dataset.origin) {
            iframe.src = `${iframe.dataset.origin}/?tab=signals&signal_id=${encodeURIComponent(entry.tag)}`;
          }
        }
        closeNotifMenu();
      }

      function renderNotifHistory() {
        notifHistoryEl.innerHTML = "";
        const shown = notifHistory.slice(0, NOTIF_HISTORY_SHOW);
        if (shown.length === 0) {
          const empty = document.createElement("div");
          empty.className = "notif-history-empty";
          empty.textContent = "No notifications yet";
          notifHistoryEl.appendChild(empty);
          return;
        }
        for (const entry of shown) {
          const item = document.createElement("button");
          item.type = "button";
          item.className = "notif-history-item";
          item.onclick = () => jumpToNotifEntry(entry);

          const title = document.createElement("span");
          title.className = "notif-history-title";
          title.textContent = entry.title;
          item.appendChild(title);

          const body = document.createElement("span");
          body.className = "notif-history-body";
          body.textContent = entry.body;
          item.appendChild(body);

          const time = document.createElement("span");
          time.className = "notif-history-time";
          time.textContent = relTime(entry.at);
          item.appendChild(time);

          notifHistoryEl.appendChild(item);
        }
      }

      function closeNotifMenu() {
        notifSettingsMenuEl.hidden = true;
        notifToggleEl.classList.remove("active");
      }

      function renderNotifButton() {
        notifToggleEl.textContent = notifEnabled ? "🔔" : "🔕";
        notifToggleEl.title = notifEnabled ? "Notifications on" : "Enable notifications";
        notifToggleEl.setAttribute("aria-label", notifToggleEl.title);
        notifEnabledCheckboxEl.checked = notifEnabled;
        notifSoundLabelEl.classList.toggle("dim", !notifEnabled);
        notifSoundCheckboxEl.checked = notifSoundEnabled;
      }

      // A distinct little tune per notification type, so which one just
      // fired is audibly obvious without looking at the screen - a new
      // trading signal (2-tone ascending "ding-dong", the original tune)
      // reads differently from a sentiment shift (3-tone ascending
      // "twinkle") purely by note COUNT, not just pitch, so it stays
      // distinguishable even played quietly/in the background.
      const SIGNAL_TUNE_HZ = [880, 1320];
      const SENTIMENT_TUNE_HZ = [660, 880, 1108.73];

      // Synthesized directly (Web Audio oscillator), not a bundled audio
      // asset - `frequencies` is one tone's pitch per array entry, played
      // in sequence.
      function playAlertSound(ctx, frequencies) {
        const now = ctx.currentTime;
        frequencies.forEach((freq, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = "sine";
          osc.frequency.value = freq;
          const start = now + i * 0.15;
          gain.gain.setValueAtTime(0.0001, start);
          gain.gain.exponentialRampToValueAtTime(0.2, start + 0.01);
          gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.13);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(start);
          osc.stop(start + 0.14);
        });
      }

      function notifyOfSignal(s) {
        const strategyName = strategyNames.get(s.strategy_id) || s.strategy_id;
        const title = `${s.action} ${s.symbol}`;
        const body = `${strategyName} · ${s.exchange} @ ${s.price}${s.status ? ` · ${s.status}` : ""}`;
        const n = new Notification(title, { body, tag: s.signal_id });
        n.onclick = () => window.focus();
        playSoundIfEnabled(SIGNAL_TUNE_HZ);
        pushNotifHistory({ type: "signal", title, body, at: Date.now(), tag: s.signal_id });
      }

      function playSoundIfEnabled(frequencies) {
        if (!notifSoundEnabled) return;
        try {
          if (!audioCtx) audioCtx = new AudioContext();
          playAlertSound(audioCtx, frequencies);
        } catch {
          // audio blocked/unsupported - the visual notification still fired
        }
      }

      const SENTIMENT_STRENGTH_LABEL = { mild: "Mild", strong: "Strong", very_strong: "Very Strong" };

      // Mirrors SentimentBadges.tsx's own fullLabel() - "Bullish (Strong)",
      // "Bearish (Mild)", or "Neutral".
      function sentimentLabel(direction, strength) {
        if (direction === "neutral" || !strength) return "Neutral";
        return `${direction === "bullish" ? "Bullish" : "Bearish"} (${SENTIMENT_STRENGTH_LABEL[strength]})`;
      }

      function notifyOfSentimentChange(symbol, exchange, prevLabel, nextLabel) {
        const title = `${symbol} sentiment: ${nextLabel}`;
        const body = `${exchange} · was ${prevLabel}`;
        const n = new Notification(title, { body, tag: `sentiment-${symbol}` });
        n.onclick = () => window.focus();
        playSoundIfEnabled(SENTIMENT_TUNE_HZ);
        pushNotifHistory({ type: "sentiment", title, body, at: Date.now(), tag: symbol });
      }

      async function pollStrategyNames() {
        const base = `${PROTOCOL}//${location.hostname}:${SIGNAL_ENGINE_BACKEND_PORT + PORT_OFFSET}`;
        try {
          const res = await fetch(`${base}/strategies`);
          if (!res.ok) return;
          const data = await res.json();
          strategyNames = new Map(data.map((s) => [s.id, s.name]));
        } catch {
          // keep the last known names rather than clearing on a blip
        }
      }

      async function pollSignals() {
        if (!notifEnabled) return;
        const base = `${PROTOCOL}//${location.hostname}:${SIGNAL_ENGINE_BACKEND_PORT + PORT_OFFSET}`;
        try {
          const res = await fetch(`${base}/signals?limit=20`);
          if (!res.ok) return;
          const signals = await res.json();
          if (seenIds === null) {
            seenIds = new Set(signals.map((s) => s.signal_id));
            return;
          }
          const fresh = signals.filter((s) => !seenIds.has(s.signal_id));
          // Oldest fresh signal first, so notifications appear in the order
          // they actually happened rather than reverse-chronological.
          for (const s of fresh.reverse()) {
            seenIds.add(s.signal_id);
            notifyOfSignal(s);
          }
        } catch {
          // stay quiet until the next tick rather than notifying about a poll failure
        }
      }

      // null = not seeded yet - same "record what's already there, don't
      // notify retroactively" convention as seenIds above. Keyed by symbol
      // (NIFTY/BANKNIFTY/GOLDM/CRUDEOILM - see market-data's
      // SENTIMENT_UNDERLYINGS) since two assets on the same exchange can
      // read opposite ways - see SentimentBadges.tsx's own comment.
      let prevSentiment = null;

      async function pollSentiment() {
        if (!notifEnabled) return;
        const base = `${PROTOCOL}//${location.hostname}:${MARKET_DATA_BACKEND_PORT + PORT_OFFSET}`;
        try {
          const res = await fetch(`${base}/options/sentiment`);
          if (!res.ok) return;
          const data = await res.json();
          const next = new Map();
          for (const [exchange, entry] of Object.entries(data.exchanges ?? {})) {
            for (const u of entry.underlyings ?? []) {
              next.set(u.symbol, { exchange, direction: u.direction, strength: u.strength });
            }
          }
          if (prevSentiment === null) {
            prevSentiment = next;
            return;
          }
          for (const [symbol, current] of next) {
            const prev = prevSentiment.get(symbol);
            if (prev && (prev.direction !== current.direction || prev.strength !== current.strength)) {
              notifyOfSentimentChange(
                symbol,
                current.exchange,
                sentimentLabel(prev.direction, prev.strength),
                sentimentLabel(current.direction, current.strength),
              );
            }
          }
          prevSentiment = next;
        } catch {
          // stay quiet until the next tick rather than notifying about a poll failure
        }
      }

      // Bell click now only opens/closes the settings dropdown (issue #1 -
      // consolidated with the OI-settings-gear pattern) - enabling/
      // disabling moved to the checkbox below, since one click target
      // can't both toggle state instantly AND open a panel.
      notifToggleEl.addEventListener("click", (ev) => {
        ev.stopPropagation();
        const willOpen = notifSettingsMenuEl.hidden;
        notifSettingsMenuEl.hidden = !willOpen;
        notifToggleEl.classList.toggle("active", willOpen);
        if (willOpen) renderNotifHistory(); // refresh relative "Xm ago" timestamps
      });
      document.addEventListener("click", (ev) => {
        if (!notifSettingsMenuEl.hidden && !notifSettingsEl.contains(ev.target)) closeNotifMenu();
      });
      document.addEventListener("keydown", (ev) => {
        if (ev.key === "Escape" && !notifSettingsMenuEl.hidden) closeNotifMenu();
      });

      notifEnabledCheckboxEl.addEventListener("change", async (e) => {
        if (!e.target.checked) {
          localStorage.setItem(NOTIF_ENABLED_KEY, "false");
          notifEnabled = false;
          seenIds = null;
          prevSentiment = null;
          renderNotifButton();
          return;
        }
        notifBlockedEl.classList.remove("active");
        // Already denied - calling requestPermission() again would just
        // silently resolve back to 'denied' with no browser prompt at all
        // (every major browser refuses to re-prompt once a site's been
        // denied). Short-circuit with an actionable message instead of
        // repeating that.
        if (Notification.permission === "denied") {
          notifBlockedEl.textContent = "Notifications are blocked for this site - allow them in your browser's site settings, then try again.";
          notifBlockedEl.classList.add("active");
          e.target.checked = false; // nothing was actually enabled - keep the checkbox honest
          return;
        }
        // Everything below runs synchronously off this change event (a
        // checkbox toggled by click/keyboard is a real user gesture, same
        // as the click this used to be) up to the await - required both
        // for Notification.requestPermission and to unlock the
        // AudioContext for sounds the poll loop plays later with no
        // gesture of its own.
        if (!audioCtx) {
          try {
            audioCtx = new AudioContext();
          } catch {
            // sound just won't play - notifications still work without it
          }
        }
        const permission = await Notification.requestPermission();
        if (permission === "granted") {
          localStorage.setItem(NOTIF_ENABLED_KEY, "true");
          notifEnabled = true;
        } else {
          if (permission === "denied") {
            notifBlockedEl.textContent = "Notifications are blocked for this site - allow them in your browser's site settings, then try again.";
            notifBlockedEl.classList.add("active");
          }
          // permission === "default" - the prompt was dismissed without a
          // choice - stay quiet, but the checkbox still needs reverting
          // since nothing was actually enabled.
          e.target.checked = false;
        }
        renderNotifButton();
      });

      notifSoundCheckboxEl.addEventListener("change", (e) => {
        notifSoundEnabled = e.target.checked;
        localStorage.setItem(NOTIF_SOUND_KEY, String(notifSoundEnabled));
      });

      renderNotifButton();
      renderNotifHistory();
      pollStrategyNames();
      pollSignals();
      setInterval(pollStrategyNames, NOTIF_POLL_MS * 4);
      setInterval(pollSignals, NOTIF_POLL_MS);
      // Same cadence as SentimentBadges.tsx's own poll (also 5 minutes,
      // reusing DHAN_POLL_INTERVAL_MS's value rather than a second magic
      // number) - each tick is a real Dhan option-chain fetch per
      // watchlist symbol server-side, no reason to check for a change
      // more often than the data itself actually refreshes.
      pollSentiment();
      setInterval(pollSentiment, DHAN_POLL_INTERVAL_MS);
    }
  </script>
</body>
</html>
