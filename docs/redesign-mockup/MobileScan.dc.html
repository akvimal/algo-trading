<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mobile - Scan OI Buildup</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1319;--s1:#151b23;--s2:#1c2430;--line:#2a3442;--tx:#e9eef5;--mu:#95a3b5;--ac:#6aa9ff;--up:#4fd3a8;--dn:#ff8b6e;--warn:#f4c15a}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:14px}
*{box-sizing:border-box}
.num{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.up{color:var(--up)}.dn{color:var(--dn)}.mu{color:var(--mu)}
.card{background:var(--s1);border:1px solid var(--line);border-radius:12px}
.lbl{font-size:12px;color:var(--mu)}
.chip{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:6px;font-size:12px;font-weight:600;background:var(--s2);border:1px solid var(--line);white-space:nowrap}
.chip.up{background:#0f2a24;border-color:#1d4a3e}.chip.dn{background:#331a14;border-color:#5a2c20}
button{font:inherit;color:inherit;cursor:pointer}
.sp{fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}.sp.up{stroke:var(--up)}.sp.dn{stroke:var(--dn)}
.fchip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:18px;border:1px solid var(--line);background:var(--s1);font-size:13px;font-weight:500;white-space:nowrap}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; overflow: hidden; background: var(--bg)">
  <div style="flex-grow: 1; min-height: 0; padding: 14px 16px 0; display: flex; flex-direction: column; gap: 12px; overflow: hidden">
    <header style="display: flex; align-items: center; justify-content: space-between; height: 40px">
      <h1 style="margin: 0; font-size: 22px; font-weight: 600">Scan</h1>
      <button aria-label="Search symbol" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--s1); display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      </button>
    </header>

    <div style="display: flex; gap: 8px; overflow: hidden">
      <button style="height: 40px; padding: 0 16px; border-radius: 20px; border: 0; background: #26344a; color: #fff; font-size: 13px; font-weight: 600; white-space: nowrap">OI Buildup</button>
      <button style="height: 40px; padding: 0 16px; border-radius: 20px; border: 1px solid var(--line); background: transparent; color: var(--mu); font-size: 13px; font-weight: 500; white-space: nowrap">Screener</button>
      <button style="height: 40px; padding: 0 16px; border-radius: 20px; border: 1px solid var(--line); background: transparent; color: var(--mu); font-size: 13px; font-weight: 500; white-space: nowrap">Live OI</button>
      <button style="height: 40px; padding: 0 16px; border-radius: 20px; border: 1px solid var(--line); background: transparent; color: var(--mu); font-size: 13px; font-weight: 500; white-space: nowrap">Advisor</button>
    </div>

    <div class="lbl" style="line-height: 1.4">End-of-day snapshot · 25 Sep, compared with the previous trading day. <span style="color: var(--warn)">Illustrative data</span></div>

    <div style="display: flex; gap: 8px; overflow: hidden">
      <button class="fchip">Call: All <span class="mu">▾</span></button>
      <button class="fchip">Put: All <span class="mu">▾</span></button>
      <button class="fchip">PCR</button>
      <button class="fchip" style="border-color: #3d6ba3; color: #cfe3ff">Sort: Call OI Δ</button>
    </div>

    <sc-for list="{{cards}}" as="c" hint-placeholder-count="3">
      <article class="card" style="padding: 12px 14px">
        <div style="display: flex; align-items: baseline; gap: 10px">
          <div style="font-size: 16px; font-weight: 600">{{c.sym}}</div>
          <div class="num" style="font-size: 14px">{{c.spot}}</div>
          <div class="num {{c.pCls}}" style="font-size: 13px">{{c.pchg}}</div>
          <div style="flex-grow: 1"></div>
          <svg width="64" height="22" viewBox="0 0 64 22"><polyline class="sp {{c.pCls}}" points="{{c.spark}}"/></svg>
        </div>
        <div style="display: flex; gap: 8px; margin-top: 10px">
          <div style="flex: 1; padding: 8px 10px; border-radius: 10px; background: var(--s2)">
            <div class="lbl">Call OI</div>
            <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 3px">
              <span class="num {{c.cCls}}" style="font-weight: 500">{{c.call}}</span><span class="chip {{c.cCls2}}">{{c.cb}}</span>
            </div>
          </div>
          <div style="flex: 1; padding: 8px 10px; border-radius: 10px; background: var(--s2)">
            <div class="lbl">Put OI</div>
            <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 3px">
              <span class="num {{c.putCls}}" style="font-weight: 500">{{c.put}}</span><span class="chip {{c.putCls2}}">{{c.pb}}</span>
            </div>
          </div>
        </div>
        <div style="display: flex; align-items: center; margin-top: 8px">
          <div class="lbl num">PCR {{c.pcr}}</div>
          <div style="flex-grow: 1"></div>
          <button aria-label="Open chart" style="width: 44px; height: 36px; border: 0; background: transparent; color: var(--mu)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="8" width="4" height="8"/><path d="M7 4v4M7 16v4"/><rect x="15" y="5" width="4" height="10"/><path d="M17 2v3M17 15v5"/></svg></button>
          <button aria-label="Set alert" style="width: 44px; height: 36px; border: 0; background: transparent; color: var(--mu)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 0112 0c0 6 2 7 2 7H4s2-1 2-7"/><path d="M10 20a2 2 0 004 0"/></svg></button>
        </div>
      </article>
    </sc-for>
  </div>
  <dc-import name="MobileNav" active="scan" hint-size="390px,76px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const UP = '0,18 10,15 20,16 30,10 40,12 50,6 64,3';
    const DN = '0,4 10,7 20,6 30,12 40,10 50,17 64,19';
    return {
      cards: [
        { sym: '360ONE', spot: '1,108.00', pchg: '▲ +1.4%', pCls: 'up', spark: UP, call: '+12.4%', cCls: 'up', cCls2: 'up', cb: 'LB', put: '−6.1%', putCls: 'dn', putCls2: 'up', pb: 'SC', pcr: '0.65' },
        { sym: 'ABB', spot: '7,120.00', pchg: '▼ −0.8%', pCls: 'dn', spark: DN, call: '+9.3%', cCls: 'up', cCls2: 'dn', cb: 'SB', put: '−4.2%', putCls: 'dn', putCls2: 'dn', pb: 'LU', pcr: '0.63' },
        { sym: 'AXISBANK', spot: '1,180.50', pchg: '▲ +0.6%', pCls: 'up', spark: UP, call: '−5.5%', cCls: 'dn', cCls2: 'up', cb: 'SC', put: '+10.2%', putCls: 'up', putCls2: 'up', pb: 'LB', pcr: '0.71' }
      ]
    };
  }
}
</script>
</body>
</html>
