<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sidebar navigation</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 232px; height: 900px; box-sizing: border-box; padding: 20px 14px; display: flex; flex-direction: column; gap: 18px; background: #0a0f15; border-right: 1px solid #232d3a; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #e9eef5; font-size: 14px">
  <div style="display: flex; align-items: center; gap: 10px; padding: 0 6px">
    <div style="width: 28px; height: 28px; border-radius: 8px; background: #6aa9ff; display: flex; align-items: center; justify-content: center">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#08111f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/></svg>
    </div>
    <div style="font-weight: 600; font-size: 15px">Algo Trading</div>
  </div>

  <div style="padding: 12px; border-radius: 10px; background: #131b25; border: 1px solid #263243; display: flex; flex-direction: column; gap: 4px">
    <div style="font-size: 11px; letter-spacing: 0.06em; color: #95a3b5; font-weight: 500">PAPER ACCOUNT</div>
    <div style="font-family: 'IBM Plex Mono', monospace; font-size: 20px; font-weight: 500">₹10,42,380</div>
    <div style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #4fd3a8">▲ +4.24% since start</div>
  </div>

  <nav style="display: flex; flex-direction: column; gap: 2px">
    <a href="Main.dc.html" style="{{s.today}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Today</a>
    <a href="DesktopScan.dc.html" style="{{s.scan}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>Scan</a>
    <a href="DesktopTrade.dc.html" style="{{s.trade}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="8" width="4" height="8"/><path d="M7 4v4M7 16v4"/><rect x="15" y="5" width="4" height="10"/><path d="M17 2v3M17 15v5"/></svg>Trade</a>
    <a href="PaperAccount.dc.html" style="{{s.portfolio}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5h6v2"/></svg>Portfolio</a>
    <div style="font-size: 11px; letter-spacing: 0.06em; color: #6f7d8f; font-weight: 500; padding: 14px 12px 6px">IMPROVE</div>
    <a href="DesktopReview.dc.html" style="{{s.review}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg>Review</a>
    <a href="DesktopAutomate.dc.html" style="{{s.automate}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>Automate</a>
    <div style="font-size: 11px; letter-spacing: 0.06em; color: #6f7d8f; font-weight: 500; padding: 14px 12px 6px">TOOLS</div>
    <a href="DesktopAlerts.dc.html" style="{{s.alerts}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 0112 0c0 6 2 7 2 7H4s2-1 2-7"/><path d="M10 20a2 2 0 004 0"/></svg>Alerts</a>
    <a href="DesktopSettings.dc.html" style="{{s.settings}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>Settings</a>
  </nav>

  <div style="flex-grow: 1"></div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <div style="font-size: 11px; letter-spacing: 0.06em; color: #95a3b5; font-weight: 500; padding: 0 4px">EXPERIENCE</div>
    <div style="display: flex; padding: 3px; border-radius: 10px; background: #131b25; border: 1px solid #263243">
      <a href="DesktopPositional.dc.html" style="{{m.guided}}">Guided</a>
      <a href="Main.dc.html" style="{{m.pro}}">Pro</a>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 10px 6px 0; font-size: 12px; color: #95a3b5">
      <span>Plan: Trader</span>
      <a href="Plans.dc.html" style="color: #6aa9ff; text-decoration: none; font-weight: 500">Manage</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["today","scan","trade","portfolio","review","automate","alerts","settings"],"default":"today"},"mode":{"editor":"enum","options":["guided","pro"],"default":"pro"},"$preview":{"width":232,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'today';
    const mode = this.props.mode ?? 'pro';
    const base = 'display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:8px;text-decoration:none;font-size:14px;';
    const on = base + 'background:#1a2b44;color:#dbe9ff;font-weight:600;';
    const off = base + 'color:#b3bfcd;font-weight:500;';
    const keys = ['today','scan','trade','portfolio','review','automate','alerts','settings'];
    const s = {};
    keys.forEach((k) => { s[k] = k === active ? on : off; });
    const mb = 'flex:1;height:30px;display:flex;align-items:center;justify-content:center;text-decoration:none;border-radius:7px;font-size:13px;font-weight:500;';
    const mOn = mb + 'background:#26344a;color:#ffffff;';
    const mOff = mb + 'background:transparent;color:#95a3b5;';
    return { s, m: { guided: mode === 'guided' ? mOn : mOff, pro: mode === 'pro' ? mOn : mOff } };
  }
}
</script>
</body>
</html>
