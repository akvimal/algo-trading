server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker embedded DNS, re-resolved every 10s: market-data-backend gets a new internal IP each
    # time it is recreated, which would otherwise 502 the socket until this container restarts.
    resolver 127.0.0.11 valid=10s;

    # Live price push (src/hooks/useQuoteSocket.ts): proxied through this app's own port rather than
    # a direct browser connection to market-data-backend's bare port, which a firewall may not open.
    location /ws/ {
        set $upstream market-data-backend:8000;
        proxy_pass http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # A quiet socket (market closed) must not be reaped as idle.
        proxy_read_timeout 3600s;
    }

    # A single-page app: every unknown path is a client-side route, so serve index.html
    # (a refresh on /portfolio must not 404).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Fingerprinted build assets never change under the same name: cache them hard.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The HTML shell and the manifest must always be revalidated, or a redeploy is
    # not picked up until the browser feels like it.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        default_type application/manifest+json;
    }
}
