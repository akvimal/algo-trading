name: algo-trading

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - ./infra/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  signal-processing-backend:
    build:
      context: ./systems/signal-processing/backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DATABASE_SCHEMA: signal_processing
      REDIS_URL: redis://redis:6379/0
      REDIS_STREAM: orders.resolved
      # A second, separate stream from REDIS_STREAM above - moves resolve()'s
      # Dhan-throttled option-chain calls off the webhook/POST /signals
      # request-response cycle onto a background consumer, purely internal
      # to this service. See app/config.py/app/consumers/signal_resolution_consumer.py.
      SIGNAL_RESOLUTION_STREAM: signals.pending_resolution
      SIGNAL_RESOLUTION_CONSUMER_GROUP: signal-processing-resolver
      SIGNAL_RESOLUTION_CONSUMER_NAME: signal-processing-resolver-1
      SIGNAL_GENERATION_BASE_URL: http://signal-generation-backend:8000
      # Option-strategy resolution only (Phase 4b of the options trading
      # module) - see app/adapters/market_data/client.py.
      MARKET_DATA_BASE_URL: http://market-data-backend:8000
    ports:
      - "${SIGNAL_PROCESSING_BACKEND_PORT}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      signal-generation-backend:
        condition: service_started
      market-data-backend:
        condition: service_started

  signal-processing-frontend:
    build:
      context: ./systems/signal-processing/frontend
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    ports:
      - "${SIGNAL_PROCESSING_FRONTEND_PORT}:80"
    depends_on:
      - signal-processing-backend

  # Infra-tier, not gated behind a profile: execution's square-off job
  # depends on this being reachable, so it's expected to be up alongside
  # postgres/redis rather than started only when the "execution" system is.
  market-data-backend:
    build:
      context: ./systems/market-data/backend
    restart: unless-stopped
    environment:
      DHAN_CLIENT_ID: ${DHAN_CLIENT_ID}
      DHAN_ACCESS_TOKEN: ${DHAN_ACCESS_TOKEN}
      # Default 20 (auto-renew every 20h). Set to 0 only if this stack ever
      # shares its DHAN_ACCESS_TOKEN with another auto-renewing stack -
      # dev/test each use their own separate token instead, so both stay
      # at the default. See app/config.py/app/scheduler.py.
      DHAN_TOKEN_RENEW_INTERVAL_HOURS: ${DHAN_TOKEN_RENEW_INTERVAL_HOURS:-20}
      # Manual override for Dhan's own SEM_LOT_UNITS, confirmed wrong for
      # MCX commodities (every FUTCOM row reports 1 regardless of real
      # contract size). Each commodity's real trading-unit/quotation-unit
      # ratio - a mini/micro variant is NOT automatically the same
      # multiplier as its full-size sibling - see app/config.py.
      # "underlying:qty" pairs, comma-separated. See
      # app/providers/dhan.py's _parse_lot_size_overrides.
      MCX_LOT_SIZE_OVERRIDES: ${MCX_LOT_SIZE_OVERRIDES:-GOLD:100,GOLDM:10,CRUDEOIL:100,CRUDEOILM:10,SILVER:30,SILVERM:5,SILVERMIC:1,SILVER100:10,NATURALGAS:1250,NATGASMINI:250}
    volumes:
      # PUT /dhan/credentials persists here (app/providers/dhan.py) so a
      # UI-submitted Dhan token survives a container restart instead of
      # reverting to the DHAN_ACCESS_TOKEN env var above - see
      # docs/architecture.md. Compose namespaces named volumes per
      # project, so dev (`algo-trading`) and test (`algo-trading-test`)
      # each get their own, matching every other dev/test isolation
      # guarantee this stack already has.
      - dhan-credentials:/data
    ports:
      - "${MARKET_DATA_BACKEND_PORT}:8000"

  market-data-frontend:
    build:
      context: ./systems/market-data/frontend
      args:
        VITE_MARKET_DATA_PORT: ${MARKET_DATA_BACKEND_PORT}
    restart: unless-stopped
    ports:
      - "${MARKET_DATA_FRONTEND_PORT}:80"
    depends_on:
      - market-data-backend

  execution-backend:
    profiles: ["execution"]
    build:
      context: ./systems/execution/backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DATABASE_SCHEMA: execution
      REDIS_URL: redis://redis:6379/0
      REDIS_STREAM: orders.resolved
      REDIS_CONSUMER_GROUP: execution-service
      MARKET_DATA_BASE_URL: http://market-data-backend:8000
    ports:
      - "${EXECUTION_BACKEND_PORT}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      market-data-backend:
        condition: service_started

  execution-frontend:
    profiles: ["execution"]
    build:
      context: ./systems/execution/frontend
      args:
        VITE_API_BASE_URL: /api
        # Data provider (Dhan) credentials settings - execution's frontend
        # calls market-data-backend directly (CORS-enabled), same
        # direct-from-browser cross-system pattern signal-generation's
        # frontend already uses for its own market-data calls.
        VITE_MARKET_DATA_PORT: ${MARKET_DATA_BACKEND_PORT}
        # Strategy names for the derivatives Orders grid's "Signal" column
        # (id -> name) - same direct-from-browser CORS pattern as above,
        # not execution's own /api proxy (this isn't execution's data).
        VITE_SIGNAL_GENERATION_PORT: ${SIGNAL_GENERATION_BACKEND_PORT}
    restart: unless-stopped
    ports:
      - "${EXECUTION_FRONTEND_PORT}:80"
    depends_on:
      - execution-backend

  # Infra-tier like market-data: signal-processing's resolution calls this
  # for every signal, so it's expected to be up alongside postgres/redis,
  # not gated behind a profile.
  signal-generation-backend:
    build:
      context: ./systems/signal-generation/backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DATABASE_SCHEMA: signal_generation
    ports:
      - "${SIGNAL_GENERATION_BACKEND_PORT}:8000"
    depends_on:
      postgres:
        condition: service_healthy

  # Reads signal-processing's API directly from the browser (CORS) for
  # per-strategy signal activity, and its own backend above for strategy
  # CRUD. Not gated behind a profile.
  signal-generation-frontend:
    build:
      context: ./systems/signal-generation/frontend
      args:
        VITE_SIGNAL_GENERATION_PORT: ${SIGNAL_GENERATION_BACKEND_PORT}
        VITE_SIGNAL_PROCESSING_PORT: ${SIGNAL_PROCESSING_BACKEND_PORT}
        VITE_MARKET_DATA_PORT: ${MARKET_DATA_BACKEND_PORT}
        VITE_EXECUTION_PORT: ${EXECUTION_BACKEND_PORT}
    restart: unless-stopped
    ports:
      - "${SIGNAL_GENERATION_FRONTEND_PORT}:80"
    depends_on:
      - signal-generation-backend

  # Static tab shell - not a system of its own, just nav + iframes onto
  # each system's already-independent frontend. See shell/README.md.
  shell:
    build:
      context: ./shell
    restart: unless-stopped
    ports:
      - "${SHELL_PORT}:80"

# --- Later phases (see docs/architecture.md) plug in here behind profiles, e.g.: ---
#   signal-generation-api:
#     profiles: ["signal-generation"]
#     build: { context: ./systems/signal-generation/api }
#     ...

volumes:
  pg-data:
  redis-data:
  dhan-credentials:
