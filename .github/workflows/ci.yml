name: CI

# Status-only - runs on every push/PR for visibility (green/red check),
# not wired up as a required/blocking check anywhere. Solo-dev repo, no
# PR-review gate: see CLAUDE.md.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend-tests:
    name: pytest (${{ matrix.system }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One entry per systems/*/backend. signal-generation and
        # signal-processing were merged into signal-engine (2026-08-28);
        # add a new system here when it gets a backend.
        system: [accounts, execution, market-data, signal-engine]
    defaults:
      run:
        working-directory: systems/${{ matrix.system }}/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: systems/${{ matrix.system }}/backend/requirements-dev.txt

      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  frontend-build:
    name: build (${{ matrix.system }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One entry per systems/*/frontend (add systems/web here when it exists).
        system: [execution, manual-trading, market-data, signal-engine]
    defaults:
      run:
        working-directory: systems/${{ matrix.system }}/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: systems/${{ matrix.system }}/frontend/package-lock.json

      - run: npm ci
      # tsc -b && vite build - type-checks then builds, see CLAUDE.md
      - run: npm run build
