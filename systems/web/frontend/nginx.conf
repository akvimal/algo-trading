server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # A single-page app: every unknown path is a client-side route, so serve index.html
    # (a refresh on /portfolio must not 404).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Fingerprinted build assets never change under the same name: cache them hard.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The HTML shell and the manifest must always be revalidated, or a redeploy is
    # not picked up until the browser feels like it.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        default_type application/manifest+json;
    }
}
