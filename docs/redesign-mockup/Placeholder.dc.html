<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Still to design</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1319;--s1:#151b23;--s2:#1c2430;--line:#2a3442;--tx:#e9eef5;--mu:#95a3b5;--ac:#6aa9ff;--up:#4fd3a8;--dn:#ff8b6e;--warn:#f4c15a}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:14px}
*{box-sizing:border-box}
.card{background:var(--s1);border:1px solid var(--line);border-radius:12px}
.lbl{font-size:12px;color:var(--mu)}
.chip{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;font-size:11px;font-weight:600;background:var(--s2);border:1px solid var(--line);white-space:nowrap}
.chip.warn{background:#332a12;border-color:#5b4a1c;color:var(--warn)}
</style>
</helmet>
<div style="width: 1440px; height: 900px; display: flex; overflow: hidden; background: var(--bg)">
  <dc-import name="Sidebar" active="" mode="pro" hint-size="232px,900px"></dc-import>

  <main style="flex-grow: 1; min-width: 0; padding: 20px 28px 24px; display: flex; flex-direction: column; gap: 16px">
    <header style="display: flex; align-items: center; gap: 20px; height: 48px">
      <div>
        <h1 style="margin: 0; font-size: 22px; font-weight: 600; line-height: 1.2">Still to design</h1>
        <div class="lbl">The prototype covers the core loop and every sidebar section. These are the remaining gaps.</div>
      </div>
      <div style="flex-grow: 1"></div>
      <a href="Main.dc.html" style="height: 34px; padding: 0 14px; border-radius: 8px; background: var(--ac); color: #08111f; font-weight: 600; font-size: 13px; text-decoration: none; display: inline-flex; align-items: center">Back to Today</a>
    </header>

    <section style="display: flex; gap: 16px">
      <sc-for list="{{items}}" as="i" hint-placeholder-count="3">
        <div class="card" style="flex: 1; padding: 18px; display: flex; flex-direction: column; gap: 10px">
          <div style="display: flex; align-items: center; justify-content: space-between">
            <div style="font-size: 17px; font-weight: 600">{{i.name}}</div>
            <span class="chip warn">Planned</span>
          </div>
          <div class="lbl" style="line-height: 1.5; font-size: 13px">{{i.what}}</div>
          <div style="margin-top: 6px; display: flex; flex-direction: column; gap: 8px">
            <sc-for list="{{i.parts}}" as="p" hint-placeholder-count="4">
              <div style="display: flex; gap: 9px; font-size: 13px; line-height: 1.4">
                <span style="width: 6px; height: 6px; border-radius: 50%; background: var(--ac); margin-top: 7px; flex-shrink: 0"></span><span>{{p}}</span>
              </div>
            </sc-for>
          </div>
        </div>
      </sc-for>
    </section>

    <section class="card" style="padding: 18px">
      <div style="font-size: 15px; font-weight: 600">Smaller pieces</div>
      <div style="display: flex; gap: 32px; margin-top: 12px">
        <sc-for list="{{more}}" as="m" hint-placeholder-count="3">
          <div style="flex: 1">
            <div style="font-size: 13px; font-weight: 600">{{m.name}}</div>
            <div class="lbl" style="margin-top: 4px; line-height: 1.5">{{m.what}}</div>
          </div>
        </sc-for>
      </div>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      items: [
        { name: 'Sign-in edge cases', what: 'The main sign-in and first-run path is designed. These branches are not.',
          parts: ['Forgot password and reset email', 'Email verification and resend', 'Two-step verification', 'Session expired and signed out elsewhere'] },
        { name: 'Mobile: the other views', what: 'Today on a phone has the Intraday view only.',
          parts: ['Positional and Options views', 'Alerts list with swipe to pause', 'Journal entry from a closed trade', 'Push notification permission prompt'] },
        { name: 'Tablet and light theme', what: 'The prototype is two sizes and dark only.',
          parts: ['Tablet layout at 768 to 1024 px', 'Sidebar collapsing to icons', 'Light theme with the same contrast rules', 'Print view for the journal'] }
      ],
      more: [
        { name: 'Portfolio tabs', what: 'Positions, Orders and History under Portfolio are labeled but not drawn.' },
        { name: 'Empty and error states', what: 'No data yet, market closed, broker disconnected, and a rejected order.' },
        { name: 'Educator view', what: 'The mentor dashboard over students paper accounts, from the Educator plan.' }
      ]
    };
  }
}
</script>
</body>
</html>
