server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS resolver, re-resolved every 10s via the
    # variable below instead of once at nginx startup/config-load (a bare
    # `proxy_pass http://signal-processing-backend:8000/` caches the IP
    # for the container's whole lifetime) - signal-processing-backend gets
    # a new internal IP every time it's recreated (routine during
    # development, e.g. `docker compose up -d --build
    # signal-processing-backend` without also touching this frontend),
    # which otherwise 502s every request here until this container itself
    # is restarted - same bug reproduced live on execution's identical
    # proxy setup.
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        # proxy_pass with a variable upstream (needed above for re-resolution)
        # does NOT do the usual location-prefix stripping a static
        # `proxy_pass http://host:port/;` does - it forwards the request URI
        # verbatim instead, which would send "/api/health" through to the
        # backend unchanged (a real 404) - confirmed live (execution's
        # identical proxy setup). This explicit rewrite strips the /api/
        # prefix first so proxy_pass forwards the same path a static
        # proxy_pass would have. `set` must come BEFORE `rewrite ... break` -
        # break halts the rewrite module's directive processing for the rest
        # of the request, so a `set` placed after it never runs (confirmed
        # live: "using uninitialized 'upstream' variable").
        set $upstream signal-processing-backend:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri /index.html;
    }
}
